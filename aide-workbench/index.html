      return `<h3 style="margin-top:0">把业务目标变成明确的交付要求</h3><div class="field-row"><label>业务目标</label><div>${e(request.description)}</div></div><div class="field-row"><label>数据粒度</label><div>统计日期 × 渠道${request.dimension ? ' × 店铺' : ''}</div></div><div class="field-row"><label>退款归属日期 <span style="color:#c4807a">*</span></label><div><div class="radio-options"><label class="radio-choice"><input type="radio" name="basis" value="refund" ${request.refundBasis === 'refund' ? 'checked' : ''} ${!edit || request.nodes[0].status === 'done' ? 'disabled' : ''}/><div>按退款发生日<small>反映当天实际资金变动</small></div></label><label class="radio-choice"><input type="radio" name="basis" value="order" ${request.refundBasis === 'order' ? 'checked' : ''} ${!edit || request.nodes[0].status === 'done' ? 'disabled' : ''}/><div>按订单日<small>反映订单批次退款情况</small></div></label></div>${!request.refundBasis ? '<p class="tiny" style="color:#a18a64;margin-top:8px">待确认 · 两种口径会影响退款日期聚合与测试结果。</p>' : ''}</div></div><div class="field-row"><label>历史范围</label><div class="flex"><input type="number" id="history-days" value="${request.historyDays}" min="1" max="365" ${!edit || request.nodes[0].status === 'done' ? 'disabled' : ''} style="width:80px"/><span class="muted">天 · 演示历史范围</span></div></div><div class="field-row"><label>来源数据</label><div>ods_orders · 订单明细<br><span class="tiny muted">ods_refunds · 退款流水（含重复示例，用于验证去重）</span></div></div><div class="field-row"><label>交付物</label><div>订单明细表、渠道交易日报、每日调度任务</div></div><div class="field-row"><label>验收条件</label><div>支付 / 退款金额一致，日期渠道唯一，无关键字段空值，09:00 前完成。<br><span class="tiny muted">发布首跑时验证完成时效。</span></div></div><div class="notice">✦ Aide 已提取需求的核心信息。确认退款口径后，将自动生成技术方案与数据模型。</div>`;
    }
    function plan(request) {
      return `<h3 style="margin-top:0">先分别聚合，再组合渠道交易指标</h3><p class="muted" style="font-size:12px">订单与退款独立处理，避免一对多关联放大支付金额。退款按${request.refundBasis === 'order' ? '订单日' : '发生日'}归属；日报以日期与渠道${request.dimension ? '、店铺' : ''}为联合粒度。</p><h3>数据模型与交付范围</h3><table><thead><tr><th>产物</th><th>粒度 / 主要字段</th><th>上游依赖</th></tr></thead><tbody><tr><td>dwd_order_detail_di</td><td>订单 · order_id / pay_amount</td><td>ods_orders</td></tr><tr><td>dwd_refund_detail_di</td><td>退款编号 · refund_id / refund_amount</td><td>ods_refunds</td></tr><tr><td>ads_channel_trade_di</td><td>日期 × 渠道${request.dimension ? ' × 店铺' : ''}</td><td>订单与退款处理产物</td></tr><tr><td>channel_trade_daily</td><td>08:30 每日调度</td><td>来源就绪 + 当前测试报告</td></tr></tbody></table><h3>执行与交接</h3><p class="muted" style="font-size:12px">采用方案后，订单开发、退款开发与调度配置并行生成。确认订单与退款成果后生成日报；日报与调度均确认后进入数据测试。当前版本报告经人工确认，再准备发布包。</p><div class="notice">自动执行范围：生成产物、样本校验与依赖交接。产物确认、已发起评审、模拟发布授权均保留人工操作。</div>`;
    }
    function codeView(request, node, ui) {
      const code = node.customSql || Aide.sql(request, node.id);
      const tabs = [
        ['sql', node.id === 'schedule' ? '配置' : 'SQL'],
        ['schema', '表结构'],
        ['diff', '差异'],
      ];
      const table = `<table><thead><tr><th>字段</th><th>类型</th><th>说明</th></tr></thead><tbody>${[['stat_date', 'DATE', '统计日期'], ['channel_id', 'STRING', '渠道标识'], ...(request.dimension ? [['shop_id', 'STRING', '店铺标识']] : []), ['pay_amount', 'BIGINT', '支付金额，分'], ['refund_amount', 'BIGINT', '退款金额，分']].map((row) => `<tr>${row.map((s) => `<td>${s}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
      return `<div class="tabs">${tabs.map(([id, name]) => `<button class="tab ${ui.artifactTab === id ? 'active' : ''}" data-action="artifact-tab" data-id="${id}">${name}</button>`).join('')}</div>${ui.artifactTab === 'schema' ? table : ui.artifactTab === 'diff' ? `<h3 style="margin-top:0">版本变更 · V${node.version}</h3><div class="notice">${node.version > 1 ? `当前版本已修改${node.nullSafe ? '金额空值处理，使用 COALESCE(..., 0)' : request.fixed ? '退款去重规则，以 refund_id 保留最新流水' : '方案或上游输入'}。旧确认与评审已失效。` : '首个版本，暂无历史差异。'}</div>${codeBlock(code)}` : `<div class="code-toolbar"><span class="tiny muted">${node.id === 'schedule' ? 'schedule.json' : `${node.id}.sql`} · V${node.version} · ${node.status === 'running' ? '生成中' : '已保存'}</span><div class="flex"><button class="text-button tiny" data-action="copy">复制</button><button class="text-button tiny" data-action="edit-sql" ${request.deliveredAt ? 'disabled' : ''}>${ui.editingSql ? '放弃编辑' : '编辑'}</button>${ui.editingSql ? '<button class="tiny" data-action="save-sql">保存新版本</button>' : ''}</div></div>${ui.editingSql ? `<textarea class="code-editor" id="sql-input" aria-label="SQL编辑器">${e(ui.sqlDraft || code)}</textarea>` : codeBlock(code)}`}<div class="notice">${node.id === 'schedule' ? '调度为结构化示例配置；真实运行与时效不在此阶段证明。' : '演示 SQL 可复制和编辑。测试使用 JavaScript 对固定样本计算核对，不连接 Hive，也不执行此 SQL。'}</div>`;
    }
    function codeBlock(code) {
      return `<div class="code">${code
        .split('\n')
        .map(
          (line, index) =>
            `<div class="code-line"><span class="line-number">${index + 1}</span><span class="line-code ${line.trim().startsWith('--') ? 'comment' : ''}">${e(line).replace(/\b(SELECT|FROM|WHERE|GROUP BY|JOIN|WITH|AS|INSERT OVERWRITE|PARTITION|SUM|COALESCE|FULL OUTER JOIN|ON)\b/g, '<span class="sql-keyword">$1</span>')}</span></div>`,
        )
        .join('')}</div>`;
    }
    function tests(request, node) {
      const result = Aide.report(request);
      if (['idle', 'running'].includes(node.status))
        return `<div class="notice">${node.status === 'running' ? '◌ 正在对固定样本执行金额、粒度与空值检查，完成后生成报告。' : '等待日报、调度和必需检查的有效产物。'}</div>`;
      return `<div class="flex between" style="margin-bottom:16px"><h3 style="margin:0">测试报告 <span class="pill">V${node.version} · 批次 ${node.batch}</span></h3>${pill(node.status === 'failed' ? '失败' : '已完成')}</div><table><thead><tr><th>检查项</th><th>预期</th><th>实际</th><th>结果</th></tr></thead><tbody>${result.checks.map((check) => `<tr><td>${check.name}</td><td class="muted">${e(check.expected)}</td><td class="muted">${e(check.actual)}</td><td class="${check.passed ? 'check-result' : 'check-failed'}">${check.passed ? '✓ 通过' : '× 失败'}</td></tr>`).join('')}</tbody></table><div class="notice">样本支付总额：${result.payment.toLocaleString()} 分；退款总额：${result.refund.toLocaleString()} 分。重复退款 R001 ${request.fixed || request.scenario !== 'refund-failure' ? '已去重' : '尚未去重'}。数据测试报告通过后仍需负责人确认。</div><h3>渠道日报预览 · 虚构样本</h3>${preview(result)}${node.status === 'failed' ? '<div class="handoff">失败证据已保存。修复候选会产生新产物版本，原人工确认与评审不可继承。</div>' : ''}`;
    }
    function preview(result) {
      return `<table><thead><tr><th>日期</th><th>渠道</th><th>支付金额 / 分</th><th>退款金额 / 分</th></tr></thead><tbody>${result.rows.map((row) => `<tr><td class="muted">${row.date}</td><td>${row.channel}${row.shop !== '全部' ? ` · ${row.shop}` : ''}</td><td>${row.payment.toLocaleString()}</td><td>${row.refund.toLocaleString()}</td></tr>`).join('')}</tbody></table>`;
    }
    function publish(request, node) {
      if (request.deliveredAt)
        return `<div class="delivery-hero"><span class="check-badge">✓</span><h2>渠道交易日报已交付</h2><p>模拟发布成功 · 首跑完成 · 所有验收条件通过</p><div class="tiny muted" style="margin-top:10px">首次交付 ${AideUI.date(request.deliveredAt)} ${AideUI.clock(request.deliveredAt)} · 总历时 ${Aide.duration(request.deliveredAt - request.createdAt)}</div></div><div class="artifact-links">${[
          ['orders', '订单明细表', '查看 SQL'],
          ['daily', '渠道交易日报表', '查看成果'],
          ['schedule', '每日调度任务', '查看配置'],
        ]
          .map(
            ([id, name, desc]) =>
              `<button data-action="node" data-id="${id}">${icon('code')}${name}<span class="download-description">${desc} →</span></button>`,
          )
          .join(
            '',
          )}<button data-action="download">${icon('check')}下载交付包<span class="download-description">SQL、报告与执行记录 · JSON</span></button></div><h3>首跑验收证据 · 模拟</h3><table><tbody><tr><td>部署检查</td><td class="check-result">✓ 当前版本一致</td></tr><tr><td>首跑执行</td><td class="check-result">✓ 模拟 08:42 完成，早于 09:00</td></tr><tr><td>数据验收</td><td class="check-result">✓ 金额、粒度、空值与来源依赖通过</td></tr></tbody></table>`;
      return `<h3 style="margin-top:0">发布包 · 电商数据项目 / 模拟环境</h3><table><thead><tr><th>发布内容</th><th>版本 / 状态</th></tr></thead><tbody>${request.nodes
        .filter((n) => ['数据开发', '数据测试'].includes(n.category))
        .map(
          (n) =>
            `<tr><td>${n.name}</td><td>${pill(n.status === 'done' ? '已完成' : AideUI.nodeLabel(n))} <span class="tiny muted">V${n.version}</span></td></tr>`,
        )
        .join(
          '',
        )}</tbody></table><div class="field-row"><label>调度安排</label><div>每日 08:30，等待订单与退款来源就绪</div></div><div class="field-row"><label>恢复方式</label><div>保留前一版本，出现异常时重新授权发布</div></div><div class="notice">${node.status === 'running' ? (node.authorizedVersion ? '◌ 已获得当前发布包授权，正在模拟部署、首跑与验收。' : '◌ 正在准备发布包，尚未发布；就绪后等待需求负责人明确授权。') : '发布授权仅由需求负责人明确确认。模拟发布成功后继续首跑，首跑通过才标记交付。'}</div>`;
    }
    function content(request, node, ui, member) {
      if (node.id === 'understand') return requirement(request, member);
      if (node.id === 'plan')
        return ['idle', 'running'].includes(node.status)
          ? `<div class="empty">${node.status === 'running' ? '◌ 正在基于已确认口径生成技术方案…' : '确认需求后自动生成技术方案。'}</div>`
          : plan(request);
      if (node.id === 'test') return tests(request, node);
      if (node.id === 'publish') return publish(request, node);
      if (node.id === 'unique')
        return `<h3>日期 × 渠道唯一性检查</h3><div class="notice">规则：相同统计日期与渠道的记录数不得超过 1。参与发布检查，结果汇入数据测试报告。${node.status === 'done' ? '当前样本检查通过，重复键 = 0。' : '等待渠道日报有效成果后自动执行。'}</div>`;
      if (node.status === 'idle')
        return '<div class="empty">上游成果尚未确认，此节点将在依赖满足后自动开始。</div>';
      return codeView(request, node, ui);
    }
    return { content };
  })(),
);

          .map(
            (event) =>
              `<div class="record"><strong class="tiny">${Aide.get(request, event.node).name} · V${event.version}</strong><p>${e(event.text)}</p><small>${event.actor} · ${AideUI.date(event.at)} ${AideUI.clock(event.at)}</small><br><button class="text-button tiny" data-action="record-node" data-id="${event.node}">查看对应节点 →</button></div>`,
          )
          .join('') || '<div class="empty">尚无执行事件，确认需求后开始记录。</div>';
    if (ui.drawer === 'sources')
      body = `<h3 style="margin-top:25px">需求原文</h3><p class="notice">${e(request.description)}</p><h3 style="margin-top:25px">ods_orders · 虚构订单样本</h3><table><thead><tr><th>订单</th><th>渠道</th><th>支付 / 分</th></tr></thead><tbody>${Aide.orders.map((o) => `<tr><td>${o.order}</td><td>${o.channel}</td><td>${o.payment}</td></tr>`).join('')}</tbody></table><h3 style="margin-top:25px">ods_refunds · 虚构退款流水</h3><table><thead><tr><th>退款编号</th><th>订单</th><th>退款 / 分</th></tr></thead><tbody>${Aide.refunds.map((r) => `<tr><td>${r.id}</td><td>${r.order}</td><td>${r.amount}</td></tr>`).join('')}</tbody></table><div class="notice">R001 为同一笔退款的重复记录。固定样本日期为 2026-10-08 / 09；来源与 SQL 均用于原型演示。</div>`;
    return `<div class="overlay"><section class="drawer" role="dialog" aria-modal="true" aria-label="${title}"><div class="flex between"><h2>${title}</h2>${close}</div><p class="subtitle">${subtitle}</p>${body}</section></div>`;
  }
  function handle(action, id, db, ui, helpers, button) {
    const request = db.requests.find((r) => r.id === ui.requestId),
      node = request && Aide.get(request, ui.nodeId);
    const member = db.member;
    if (action === 'nav') {
      if (!helpers.leaveEditor()) return;
      ui.requestId = null;
      ui.tab = id;
      ui.filter = '';
      ui.drawer = null;
    }
    if (action === 'filter') {
      ui.filter = id === 'sessions' ? '' : id;
      if (id === 'sessions') ui.tab = 'sessions';
    }
    if (action === 'clear-filter') {
      ui.filter = '';
      ui.search = '';
    }
    if (action === 'create') ui.drawer = 'create';
    if (action === 'open') {
      if (!helpers.leaveEditor()) return;
      ui.requestId = id;
      const r = db.requests.find((item) => item.id === id);
      r.draft = false;
      ui.nodeId =
        button.dataset.node ||
        Aide.actionable(r, member)[0]?.id ||
        (r.deliveredAt ? 'publish' : r.nodes.find((n) => n.status !== 'done')?.id || 'understand');
    }
    if (action === 'node' || action === 'record-node') {
      if (!helpers.leaveEditor()) return;
      ui.nodeId = id;
      ui.artifactTab = 'sql';
      if (action === 'record-node') ui.drawer = null;
    }
    if (action === 'close-drawer') ui.drawer = null;
    if (['transfer', 'review', 'review-decision', 'flow', 'records', 'sources'].includes(action))
      ui.drawer = action;
    if (action === 'expand') ui.expanded = !ui.expanded;
    if (action === 'time-tab') ui.timeTab = id;
    if (action === 'artifact-tab') {
      if (!helpers.leaveEditor()) return;
      ui.artifactTab = id;
    }
    if (action === 'toggle-chat') ui.chatCollapsed = !ui.chatCollapsed;
    if (action === 'pause') {
      request.paused = !request.paused;
      Aide.event(
        request,
        node,
        'pause',
        request.paused ? '用户暂停自动执行，已有成果已保存。' : '用户恢复自动执行。',
        member,
      );
      if (!request.paused)
        request.nodes
          .filter((n) => n.status === 'running')
          .forEach((n) => (n.dueAt = Date.now() + 1200));
    }
    if (action === 'confirm') {
      Aide.confirm(request, node.id, member);
      helpers.toast(
        node.id === 'publish'
          ? '已授权模拟发布，正在收集首跑证据'
          : '当前版本已确认，有效成果已自动交接',
      );
    }
    if (action === 'accept') Aide.acceptTransfer(request, node.id, member);
    if (action === 'add-check') {
      Aide.addCheck(request, member);
      ui.drawer = null;
      ui.nodeId = 'unique';
      helpers.toast('流程已保存，唯一性检查已真实加入必需测试');
    }
    if (action === 'prompt') {
      node.drafts[member] = id;
    }
    if (action === 'send') {
      const text = (node.drafts[member] || '').trim();
      if (!text) throw Error('请先输入消息或问题');
      Aide.message(request, node.id, member, text);
      node.drafts[member] = '';
      const suggestion = Aide.suggestion(request, node, text);
      if (suggestion) {
        node.suggestion = suggestion;
        Aide.message(
          request,
          node.id,
          'Aide',
          `理解你的调整目标：${suggestion.summary} 已生成预览，正式产物将在你应用后更新。`,
        );
      } else if (/解释|为什么|汇总|发布|通过|好了/.test(text))
        Aide.message(
          request,
          node.id,
          'Aide',
          `当前 ${node.name} V${node.version}，状态为${AideUI.nodeLabel(node)}。${node.id === 'publish' ? '发布需要需求负责人授权、当前版本数据测试通过，首跑成功后才交付。' : '支付与退款分别聚合，可避免关联放大金额。'} 文字回复会保留在讨论中，不会代替确认、评审或发布授权。`,
        );
      else
        Aide.message(
          request,
          node.id,
          'Aide',
          '已保留你的消息。本 demo 使用确定规则解析；请明确要调整的口径、店铺维度、金额空值或唯一性用例，或 @同事讨论。',
        );
    }
    if (action === 'discard') delete node.suggestion;
    if (action === 'apply') {
      const suggestion = node.suggestion;
      if (!suggestion || suggestion.version !== node.version)
        throw Error('内容已更新，请重新生成建议');
      if (member !== node.owner && member !== request.owner)
        throw Error('只有负责人可以应用正式变更');
      if (request.deliveredAt) throw Error('已交付成果只读');
      if (suggestion.kind === 'requirement') {
        request.refundBasis = suggestion.basis;
        request.historyDays = suggestion.days;
        request.version++;
        Aide.revise(request, node.id, member);
      }
      if (suggestion.kind === 'dimension') {
        request.dimension = true;
        Aide.revise(request, node.id, member);
      }
      if (suggestion.kind === 'sql') {
        node.nullSafe = true;
        Aide.revise(request, node.id, member);
      }
      if (suggestion.kind === 'unique') Aide.addCheck(request, member);
      delete node.suggestion;
      helpers.toast('修改已应用，新版本等待确认');
    }
    if (action === 'repair') {
      if (member !== node.owner && member !== request.owner) throw Error('请切换为负责人处理');
      if (node.id === 'publish') {
        request.publishFixed = true;
        node.status = 'waiting';
        delete node.authorizedVersion;
        helpers.toast('来源已模拟恢复，请审阅并重新授权发布');
      } else {
        request.fixed = true;
        Aide.revise(request, 'refunds', member);
        ui.nodeId = 'refunds';
        Aide.event(
          request,
          Aide.get(request, 'refunds'),
          'repair',
          '根据失败证据生成退款去重候选，新版本需人工确认后重测。',
        );
      }
    }
    if (action === 'edit-sql') {
      if (member !== node.owner && member !== request.owner) throw Error('只有负责人可以编辑');
      if (ui.editingSql) {
        if (!helpers.leaveEditor()) return;
      } else {
        request.paused = true;
        ui.editingSql = true;
        ui.sqlDraft = node.customSql || Aide.sql(request, node.id);
        helpers.toast('已暂停自动执行，编辑内容不会被覆盖');
      }
    }
    if (action === 'save-sql') {
      if (!(ui.sqlDraft || '').trim()) throw Error('SQL 不能为空');
      node.customSql = ui.sqlDraft;
      Aide.revise(request, node.id, member);
      ui.editingSql = false;
      request.paused = false;
      helpers.toast('新版本已保存，样本测试不执行自定义 SQL，请检查后确认');
    }
    if (action === 'copy') helpers.copy(node.customSql || Aide.sql(request, node.id));
    if (action === 'download') helpers.download(request);
  }
  function submit(form, db, ui) {
    const data = new FormData(form),
      request = db.requests.find((r) => r.id === ui.requestId);
    if (form.id === 'create-form') {
      const title = String(data.get('title') || '').trim(),
        description = String(data.get('description') || '').trim();
      if (!title || !description) throw Error('请填写需求名称和业务目标');
      const next = Aide.createRequest(title, db.member, String(data.get('scenario')));
      next.description = description;
      next.refundBasis = /发生日/.test(description)
        ? 'refund'
        : /订单日/.test(description)
          ? 'order'
          : '';
      next.historyDays = Math.max(
        1,
        Math.min(365, Number(description.match(/(\d+)\s*天/)?.[1] || 30)),
      );
      db.requests.unshift(next);
      ui.requestId = next.id;
      ui.nodeId = 'understand';
      ui.artifactTab = 'sql';
    }
    if (form.id === 'transfer-form') {
      Aide.transfer(request, ui.nodeId, db.member, String(data.get('target')));
      Aide.message(request, ui.nodeId, db.member, `交接说明：${data.get('note')}`);
    }
    if (form.id === 'review-form') {
      Aide.review(request, ui.nodeId, db.member, data.getAll('reviewer').map(String));
      Aide.message(request, ui.nodeId, db.member, `评审关注点：${data.get('note')}`);
    }
    if (form.id === 'decision-form')
      Aide.reviewDecision(
        request,
        ui.nodeId,
        db.member,
        data.get('decision') === 'passed',
        String(data.get('opinion')),
      );
    ui.drawer = null;
  }
  return { drawer, handle, submit };
})();

</script>
    <script>
(() => {
  const storageKey = 'aide-data-workbench-demo-v1';
  let db,
    storageWarning = false;
  try {
    db = JSON.parse(localStorage.getItem(storageKey) || 'null');
  } catch {
    storageWarning = true;
  }
  if (!db || db.schema !== 1 || !Array.isArray(db.requests)) db = Aide.seed();
  const ui = {
    tab: 'overview',
    requestId: null,
    nodeId: 'understand',
    range: 7,
    filter: '',
    search: '',
    drawer: null,
    timeTab: 'overview',
    artifactTab: 'sql',
    chatCollapsed: false,
    expanded: false,
    editingSql: false,
    sqlDraft: '',
    personal: null,
  };
  try {
    Object.assign(ui, JSON.parse(sessionStorage.getItem(`${storageKey}-view`) || '{}'), {
      drawer: null,
      editingSql: false,
      personal: null,
    });
  } catch {
    storageWarning = true;
  }
  if (!db.requests.some((r) => r.id === ui.requestId)) ui.requestId = null;
  const app = document.getElementById('app');
  function toast(text) {
    const box = document.getElementById('toast');
    box.textContent = text;
    box.classList.add('visible');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => box.classList.remove('visible'), 4000);
  }
  function save() {
    try {
      localStorage.setItem(storageKey, JSON.stringify(db));
      sessionStorage.setItem(`${storageKey}-view`, JSON.stringify(ui));
    } catch {
      if (!storageWarning) toast('浏览器存储不可用，当前内容仅在本次页面中保留。');
      storageWarning = true;
    }
  }
  function render() {
    const focus = document.activeElement?.id,
      selection = document.activeElement?.selectionStart;
    if (ui.requestId) {
      const request = db.requests.find((r) => r.id === ui.requestId);
      if (!Aide.get(request, ui.nodeId)) ui.nodeId = 'understand';
      const node = Aide.get(request, ui.nodeId);
      node.seen[db.member] = node.messages.length;
    }
    app.innerHTML =
      AideUI.shell(db, ui, ui.requestId ? AideUI.detail(db, ui) : AideUI.workspace(db, ui)) +
      AideController.drawer(db, ui);
    AidePersonalRuntime.mount(db, ui);
    if (focus && document.getElementById(focus)) {
      const input = document.getElementById(focus);
      input.focus();
      if (
        selection !== null &&
        typeof input.setSelectionRange === 'function' &&
        !['number', 'radio', 'checkbox'].includes(input.type)
      )
        input.setSelectionRange(selection, selection);
    }
    const feed = app.querySelector('.chat-feed');
    if (feed) feed.scrollTop = feed.scrollHeight;
    save();
  }
  function leaveEditor() {
    if (ui.editingSql && !confirm('有未保存的 SQL 修改。放弃修改并离开编辑？')) return false;
    ui.editingSql = false;
    return true;
  }
  async function copy(text) {
    try {
      await navigator.clipboard.writeText(text);
      toast('已复制当前版本内容');
    } catch {
      const area = document.createElement('textarea');
      area.value = text;
      document.body.appendChild(area);
      area.select();
      const copied = document.execCommand('copy');
      area.remove();
      toast(copied ? '已复制当前版本内容' : '复制权限不可用，请从代码区手动选择复制');
    }
  }
  function download(request) {
    const blob = new Blob(
      [
        JSON.stringify(
          {
            mode: '本地模拟，非生产交付',
            title: request.title,
            versions: request.nodes.map((n) => ({ name: n.name, version: n.version })),
            sql: Object.fromEntries(
              request.nodes
                .filter((n) => n.category === '数据开发')
                .map((n) => [n.id, n.customSql || Aide.sql(request, n.id)]),
            ),
            report: Aide.report(request),
            events: request.events,
            deliveredAt: request.deliveredAt,
          },
          null,
          2,
        ),
      ],
      { type: 'application/json' },
    );
    const url = URL.createObjectURL(blob),
      link = document.createElement('a');
    link.href = url;
    link.download = 'aide-channel-delivery.json';
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('交付包已下载，包含 SQL、样本报告与执行记录');
  }
  app.addEventListener('click', (event) => {
    const button = event.target.closest('[data-action]');
    if (!button || button.disabled) return;
    try {
      if (!AidePersonalUI.handle(button.dataset.action, button.dataset.id, db, ui, { toast, copy }))
        AideController.handle(
          button.dataset.action,
          button.dataset.id,
          db,
          ui,
          { toast, leaveEditor, copy, download },
          button,
        );
      render();
      if (['nav', 'open'].includes(button.dataset.action)) window.scrollTo(0, 0);
    } catch (error) {
      toast(error.message);
    }
  });
  app.addEventListener('submit', (event) => {
    event.preventDefault();
    try {
      AideController.submit(event.target, db, ui);
      render();
      if (event.target.id === 'create-form') window.scrollTo(0, 0);
    } catch (error) {
      const output = document.getElementById('form-error');
      if (output) output.textContent = error.message;
      else toast(error.message);
    }
  });
  app.addEventListener('input', (event) => {
    if (AidePersonalUI.input(event.target, ui)) return;
    if (event.target.id === 'search') {
      ui.search = event.target.value;
      render();
    }
    const request = db.requests.find((r) => r.id === ui.requestId);
    if (event.target.id === 'chat-input') {
      Aide.get(request, ui.nodeId).drafts[db.member] = event.target.value;
      save();
    }
    if (event.target.id === 'sql-input') {
      ui.sqlDraft = event.target.value;
      save();
    }
  });
  app.addEventListener('change', (event) => {
    if (event.target.id === 'personal-file') {
      AidePersonalUI.importFile(event.target.files[0], ui, { toast, render });
      return;
    }
    if (event.target.id === 'member') {
      if (ui.drawer === 'personalize') {
        ui.drawer = null;
        ui.personal = null;
      }
      db.member = event.target.value;
      if (ui.requestId) {
        const request = db.requests.find((r) => r.id === ui.requestId);
        const next = Aide.actionable(request, db.member)[0];
        if (next && !ui.editingSql) ui.nodeId = next.id;
      }
    }
    if (event.target.id === 'range') ui.range = Number(event.target.value);
    const request = db.requests.find((r) => r.id === ui.requestId);
    if (event.target.name === 'basis') request.refundBasis = event.target.value;
    if (event.target.id === 'history-days')
      request.historyDays = Math.max(1, Math.min(365, Number(event.target.value) || 30));
    render();
  });
  app.addEventListener('keydown', (event) => {
    if (
      event.target.id === 'chat-input' &&
      event.key === 'Enter' &&
      (event.metaKey || event.ctrlKey)
    ) {
      event.preventDefault();
      app.querySelector('[data-action="send"]').click();
    }
    if (event.key === 'Escape' && ui.drawer) {
      if (ui.drawer === 'personalize') {
        app.querySelector('[data-action="personal-close"]').click();
        return;
      }
      ui.drawer = null;
      render();
    }
    if (event.key === 'Enter' && event.target.matches('g[data-action],circle[data-action]'))
      event.target.dispatchEvent(new MouseEvent('click', { bubbles: true }));
  });
  setInterval(() => {
    let changed = false;
    db.requests.forEach((request) => {
      if (Aide.tick(request)) changed = true;
    });
    if (changed && !ui.drawer && !ui.editingSql) render();
    else if (changed) save();
    document
      .querySelectorAll('[data-clock]')
      .forEach(
        (element) =>
          (element.textContent = Aide.duration(
            (Number(element.dataset.end) || Date.now()) - Number(element.dataset.clock),
          )),
      );
  }, 300);
  window.addEventListener('message', (event) =>
    AidePersonalRuntime.receive(event, db, ui, { toast, render }),
  );
  setInterval(() => AidePersonalRuntime.sync(db), 10000);
  render();
  if (storageWarning) toast('存储读取失败，已恢复默认演示数据。');
})();

</script>
