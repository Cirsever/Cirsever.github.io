<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Aide · 数据开发工作台</title>
    <style>
:root {
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    'Segoe UI',
    'PingFang SC',
    'Microsoft YaHei',
    sans-serif;
  color: #242b3d;
  background: #f6f8fb;
  font-size: 13px;
  font-synthesis: none;
  --accent: #5662dc;
  --muted: #8690a3;
  --line: #e9edf3;
  --green: #258869;
  --red: #c5535c;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
}
button,
input,
select,
textarea {
  font: inherit;
}
button {
  cursor: pointer;
  color: inherit;
}
button:disabled {
  cursor: not-allowed;
  opacity: 0.48;
}
button:focus-visible,
a:focus-visible,
select:focus-visible {
  outline: 3px solid #a9b1ff;
  outline-offset: 3px;
}
button {
  border: 1px solid var(--line);
  border-radius: 7px;
  background: white;
  padding: 8px 12px;
  transition:
    background 0.16s,
    border-color 0.16s;
}
button:hover {
  background: #f3f5ff;
  border-color: #cdd3ee;
}
button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
  font-weight: 600;
  box-shadow: 0 3px 8px #5662dc20;
}
button.primary:hover {
  background: #444fc8;
}
.text-button {
  border: 0;
  background: transparent;
  color: var(--accent);
  padding: 6px;
}
.muted {
  color: var(--muted);
}
.tiny {
  font-size: 11px;
}
.eyebrow {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1.5px;
  color: #8993a9;
  text-transform: uppercase;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 1px solid #e0e4ed;
  border-radius: 5px;
  font-size: 11px;
  padding: 3px 7px;
  white-space: nowrap;
  color: #69738a;
  background: #fafbfe;
}
.pill.blue {
  color: #5861cf;
  background: #f0f1ff;
  border-color: #e0e3ff;
}
.pill.green {
  color: #258869;
  background: #edf8f2;
  border-color: #d9eee4;
}
.pill.red {
  color: #c5535c;
  background: #fff1f1;
  border-color: #f3d6da;
}
.pill.amber {
  color: #af7a1f;
  background: #fff8e9;
  border-color: #f1e4c8;
}
.icon {
  width: 18px;
  height: 18px;
  display: inline-block;
  vertical-align: middle;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.avatar {
  height: 27px;
  width: 27px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 11px;
  font-weight: 600;
  border-radius: 50%;
  background: #ebedf9;
  color: #6b75a8;
}
.avatar.ai {
  background: #eeecff;
  color: #7561c8;
}
.flex {
  display: flex;
  align-items: center;
  gap: 10px;
}
.between {
  justify-content: space-between;
}
.stack {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1 {
  font-size: 25px;
  font-weight: 650;
  letter-spacing: -0.6px;
}
h2 {
  font-size: 15px;
  font-weight: 600;
}
h3 {
  font-size: 13px;
  font-weight: 600;
}
p {
  line-height: 1.7;
}
small {
  font-size: 11px;
}
.app-shell {
  display: flex;
  min-height: 100vh;
}
.sidebar {
  width: 204px;
  flex-shrink: 0;
  background: #fcfdff;
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  position: fixed;
  height: 100vh;
  padding: 27px 16px;
}
.logo {
  display: flex;
  gap: 9px;
  align-items: center;
  margin: 0 12px 35px;
  font-size: 24px;
  letter-spacing: -1.1px;
  font-weight: 700;
  color: #303754;
}
.logo-mark {
  background: #5964dd;
  border-radius: 9px;
  color: white;
  width: 29px;
  height: 29px;
  display: grid;
  place-items: center;
  font-size: 23px;
  box-shadow: 0 4px 10px #5964dd22;
}
.nav-label {
  padding: 0 13px;
  color: #a2a9b9;
  font-size: 10px;
  letter-spacing: 1.4px;
  margin: 19px 0 10px;
}
.nav-item {
  border: 0;
  background: transparent;
  display: flex;
  width: 100%;
  gap: 12px;
  align-items: center;
  padding: 12px;
  border-radius: 7px;
  color: #768098;
  text-align: left;
  margin-bottom: 3px;
}
.nav-item.active {
  background: #eef0ff;
  color: var(--accent);
  font-weight: 600;
}
.nav-count {
  margin-left: auto;
  background: #dfe3ff;
  padding: 1px 6px;
  font-size: 10px;
  border-radius: 4px;
}
.project-card {
  margin: 6px 8px;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 13px;
  font-size: 12px;
  background: white;
}
.side-footer {
  margin-top: auto;
  padding: 15px 12px 0;
  border-top: 1px solid var(--line);
}
.main {
  margin-left: 204px;
  min-width: 0;
  width: calc(100% - 204px);
}
.topbar {
  height: 67px;
  border-bottom: 1px solid var(--line);
  padding: 0 34px;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.breadcrumb {
  font-size: 12px;
  color: #8b94a6;
}
.breadcrumb span {
  color: #485268;
}
.member-select {
  border: 0;
  background: transparent;
  color: #59647a;
  padding: 6px;
  max-width: 150px;
}
.page {
  padding: 31px 35px 36px;
  max-width: 1700px;
  margin: auto;
}
.page-heading {
  margin-bottom: 25px;
}
.subtitle {
  color: #8992a5;
  margin-top: 8px;
  font-size: 12px;
}
.toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
}
.toolbar select {
  background: white;
  border: 1px solid var(--line);
  padding: 8px 11px;
  border-radius: 7px;
  color: #65718a;
}
.metrics {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 22px;
}
.metric {
  background: white;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 20px 22px;
  text-align: left;
  position: relative;
}
.metric-label {
  color: #7b869e;
  font-size: 12px;
}
.metric-number {
  font-size: 31px;
  font-weight: 600;
  letter-spacing: -1px;
  margin: 12px 0 7px;
}
.metric-icon {
  position: absolute;
  right: 20px;
  top: 18px;
  background: #f2f3fc;
  color: #7f8ac2;
  padding: 9px;
  border-radius: 8px;
}
.metric-foot {
  font-size: 11px;
  color: #99a2b3;
}
.charts {
  display: grid;
  grid-template-columns: 1fr 1.35fr;
  gap: 20px;
  margin-bottom: 22px;
}
.panel {
  background: white;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 21px 23px;
}
.panel-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 22px;
}
.distribution {
  display: flex;
  align-items: center;
  gap: 27px;
  padding: 5px 0 10px;
}
.donut {
  width: 145px;
  height: 145px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.donut-hole {
  width: 112px;
  height: 112px;
  border-radius: 50%;
  background: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.donut-hole strong {
  font-size: 30px;
  font-weight: 600;
}
.legend-list {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 13px;
}
.legend-row {
  border: 0;
  display: flex;
  align-items: center;
  background: transparent;
  padding: 0;
  font-size: 12px;
  color: #758198;
  gap: 9px;
  width: 100%;
}
.legend-row strong {
  margin-left: auto;
  color: #525d74;
  font-weight: 500;
}
.dot {
  width: 7px;
  height: 7px;
  display: inline-block;
  border-radius: 50%;
  background: #737be5;
}
.dot.c1 {
  background: #a0abed;
}
.dot.c2 {
  background: #c9cef1;
}
.dot.c3 {
  background: #dfe4ef;
}
.chart {
  width: 100%;
  height: 163px;
  overflow: visible;
}
.chart text {
  fill: #a0a9b9;
  font-size: 10px;
  font-family: inherit;
}
.chart .gridline {
  stroke: #f0f2f6;
  stroke-dasharray: 3 4;
}
.chart .trend {
  fill: none;
  stroke: #727ae1;
  stroke-width: 2.3;
}
.chart circle {
  fill: white;
  stroke: #727ae1;
  stroke-width: 2;
  cursor: pointer;
}
.task-strip {
  background: #f0f2ff;
  border: 1px solid #e0e4fd;
  padding: 16px 19px;
  border-radius: 9px;
  margin-bottom: 23px;
}
.task-strip p {
  font-size: 12px;
  color: #7e88a8;
  margin-top: 4px;
}
.strip-icon {
  color: #6470d4;
  background: white;
  border-radius: 8px;
  padding: 10px;
}
.table-head {
  margin-bottom: 13px;
}
.tabs {
  display: flex;
  align-items: center;
  gap: 22px;
  margin: 0 0 20px;
  border-bottom: 1px solid var(--line);
}
.tab {
  padding: 12px 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: #8b94a8;
  font-size: 12px;
  position: relative;
}
.tab.active {
  color: #5360d3;
  font-weight: 600;
}
.tab.active:after {
  position: absolute;
  bottom: -1px;
  left: 0;
  right: 0;
  content: '';
  height: 2px;
  background: #6670df;
}
table {
  border-collapse: collapse;
  width: 100%;
  font-size: 12px;
  text-align: left;
}
th {
  color: #9099ac;
  font-weight: 500;
  background: #fafbfd;
  padding: 13px 15px;
  border-bottom: 1px solid var(--line);
}
td {
  padding: 17px 15px;
  border-bottom: 1px solid #f0f2f6;
  vertical-align: middle;
}
tbody tr:last-child td {
  border-bottom: 0;
}
.req-name {
  font-weight: 550;
  color: #3a4560;
  cursor: pointer;
}
.req-name:hover {
  color: var(--accent);
}
.req-desc {
  margin-top: 6px;
  color: #a0a9b9;
  font-size: 11px;
}
.progress {
  height: 4px;
  width: 84px;
  background: #eef0f7;
  border-radius: 2px;
  margin-top: 6px;
  overflow: hidden;
}
.progress span {
  height: 100%;
  background: #8b94e8;
  display: block;
}
.session-summary {
  display: flex;
  gap: 24px;
  margin-top: 22px;
  padding: 17px 20px;
  border-top: 1px solid var(--line);
  color: #8a94a7;
  font-size: 11px;
}
.session-summary strong {
  color: #606c83;
}
.empty {
  text-align: center;
  padding: 55px;
  color: #8b95a9;
}
.search {
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px 12px;
  background: white;
  outline: none;
  width: 210px;
}
.detail-page {
  padding-top: 24px;
}
.detail-title {
  margin-bottom: 20px;
}
.detail-title h1 {
  font-size: 22px;
}
.detail-meta {
  margin-top: 12px;
  display: flex;
  gap: 13px;
  align-items: center;
  color: #929bae;
  font-size: 11px;
}
.dag-panel {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 270px;
  margin-bottom: 18px;
  background: white;
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
}
.dag-area {
  padding: 15px 18px 8px;
  min-width: 0;
}
.dag-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 9px;
}
.dag-legend {
  display: flex;
  gap: 13px;
  color: #949eaf;
  font-size: 10px;
}
.dag-legend i {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  margin-right: 4px;
}
.graph {
  width: 100%;
  height: 226px;
  overflow: visible;
}
.graph text {
  font-family: inherit;
}
.graph .node-box {
  stroke-width: 1;
}
.graph g {
  cursor: pointer;
  outline: none;
}
.graph g:focus-visible .node-box {
  stroke: #6c77ed;
  stroke-width: 3;
}
.graph .idle .node-box {
  fill: #fbfcfe;
  stroke: #e3e8f0;
}
.graph .waiting .node-box {
  fill: #f0f5ff;
  stroke: #d0dff6;
}
.graph .running .node-box {
  fill: #fffaee;
  stroke: #efdfb8;
}
.graph .done .node-box {
  fill: #f1faf5;
  stroke: #c8e7d7;
}
.graph .failed .node-box {
  fill: #fff3f3;
  stroke: #edcad0;
}
.graph .selected-ring {
  fill: none;
  stroke: #818af0;
  stroke-width: 2;
}
.graph .node-name {
  font-size: 11px;
  font-weight: 550;
  fill: #46546f;
}
.graph .node-state {
  font-size: 9px;
  fill: #8795ac;
}
.graph .done .node-state {
  fill: #4c9575;
}
.graph .failed .node-state {
  fill: #c55d66;
}
.graph .running .node-state {
  fill: #b18b37;
}
.graph .node-owner {
  font-size: 8px;
  fill: #99a3b5;
}
.graph .edge {
  fill: none;
  stroke: #dce3ef;
  stroke-width: 1.3;
  stroke-dasharray: 4 4;
}
.graph .edge.satisfied {
  stroke: #aebdcc;
  stroke-dasharray: none;
}
.time-panel {
  border-left: 1px solid var(--line);
  background: #fcfdff;
  padding: 16px 18px;
}
.time-panel .tabs {
  gap: 19px;
  margin-bottom: 14px;
}
.time-panel .tab {
  font-size: 11px;
  padding: 3px 0 10px;
}
.time-number {
  font-size: 18px;
  font-weight: 600;
  margin: 5px 0 7px;
  color: #525f7b;
}
.time-bar {
  display: flex;
  height: 5px;
  gap: 2px;
  margin: 16px 0 13px;
}
.time-bar span {
  background: #9bace7;
  border-radius: 2px;
  flex: 1;
}
.time-bar span:nth-child(2) {
  background: #c9d5f0;
}
.time-row {
  display: flex;
  justify-content: space-between;
  margin: 11px 0;
  font-size: 10px;
  color: #97a1b3;
}
.next-step {
  position: sticky;
  top: 0;
  z-index: 4;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 21px;
  border: 1px solid #dfe4fb;
  border-radius: 9px;
  background: #f2f4ff;
  margin-bottom: 20px;
  box-shadow: 0 3px 9px #5260ca04;
}
.next-step h3 {
  color: #515d84;
  margin-bottom: 5px;
}
.next-step p {
  font-size: 11px;
  color: #8793ae;
}
.next-step.error {
  background: #fff4f3;
  border-color: #f2d8d7;
}
.next-step.success {
  background: #f0f9f4;
  border-color: #d7ebdf;
}
.work-area {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 370px;
  gap: 20px;
  align-items: stretch;
}
.work-area.collapsed {
  grid-template-columns: minmax(0, 1fr) 52px;
}
.artifact {
  padding: 23px;
  min-height: 435px;
}
.artifact-heading {
  margin-bottom: 18px;
}
.input-source {
  font-size: 10px;
  color: #949eb1;
  background: #fafbfd;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  padding: 10px 0;
  margin-bottom: 22px;
}
.artifact h3 {
  margin: 20px 0 12px;
}
.field-row {
  display: grid;
  grid-template-columns: 95px 1fr;
  padding: 12px 0;
  gap: 18px;
  border-bottom: 1px solid #f0f2f7;
  font-size: 12px;
}
.field-row label {
  color: #8a95aa;
  align-self: center;
}
.field-row input {
  border: 0;
  background: #fafbfe;
  border-radius: 5px;
  padding: 8px;
  color: #53617c;
  width: 100%;
}
.radio-options {
  display: flex;
  gap: 12px;
}
.radio-choice {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 7px;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 12px;
  color: #69748b;
}
.radio-choice:has(input:checked) {
  border-color: #9ea8ed;
  background: #f4f5ff;
}
.radio-choice input {
  width: auto;
}
.radio-choice small {
  display: block;
  margin-top: 3px;
  color: #98a2b5;
}
.code-toolbar {
  display: flex;
  justify-content: space-between;
  margin: 13px 0;
}
.code {
  background: #f9fafd;
  border: 1px solid #e9edf5;
  border-radius: 7px;
  padding: 17px 0;
  max-height: 365px;
  overflow: auto;
  font-family: 'SFMono-Regular', Consolas, monospace;
  font-size: 11px;
  line-height: 1.95;
}
.code-line {
  display: flex;
  white-space: pre;
}
.line-number {
  color: #b3bccd;
  text-align: right;
  width: 39px;
  padding-right: 13px;
  flex-shrink: 0;
  user-select: none;
}
.line-code {
  color: #556380;
  padding-right: 15px;
}
.line-code.comment {
  color: #9ba5b8;
}
.code-editor {
  width: 100%;
  min-height: 330px;
  font:
    11px/1.9 'SFMono-Regular',
    monospace;
  border: 1px solid #cdd5f0;
  background: #fbfcff;
  padding: 15px;
  resize: vertical;
  border-radius: 7px;
}
.notice {
  padding: 12px 14px;
  background: #f7f8fc;
  border-radius: 6px;
  color: #8a95aa;
  font-size: 11px;
  line-height: 1.7;
  margin-top: 16px;
}
.chat {
  display: flex;
  flex-direction: column;
  max-height: 670px;
  padding: 0;
  overflow: hidden;
}
.chat-header {
  padding: 18px;
  border-bottom: 1px solid var(--line);
}
.chat-header h2 {
  font-size: 13px;
}
.chat-members {
  display: flex;
  gap: 5px;
  margin-top: 11px;
}
.chat-members .avatar {
  height: 22px;
  width: 22px;
  font-size: 9px;
}
.chat-feed {
  flex: 1;
  min-height: 285px;
  max-height: 460px;
  overflow: auto;
  padding: 18px;
}
.message {
  display: flex;
  gap: 9px;
  margin-bottom: 20px;
  align-items: flex-start;
}
.message .avatar {
  width: 24px;
  height: 24px;
  font-size: 9px;
}
.message-meta {
  font-size: 10px;
  color: #98a3b6;
  margin-bottom: 5px;
}
.message-meta strong {
  color: #5e6b83;
  font-weight: 550;
  margin-right: 7px;
}
.message-text {
  font-size: 11px;
  line-height: 1.85;
  color: #76829a;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.message.ai-message .message-text {
  background: #f7f8fe;
  padding: 10px 12px;
  border: 1px solid #eceffa;
  border-radius: 0 7px 7px 7px;
}
.chat-compose {
  padding: 13px;
  border-top: 1px solid var(--line);
  background: #fff;
}
.chat-compose textarea {
  width: 100%;
  border: 1px solid #e4e8f2;
  resize: none;
  border-radius: 7px;
  height: 83px;
  padding: 11px;
  outline: none;
  color: #65718b;
  font-size: 11px;
}
.chat-compose textarea:focus {
  border-color: #a6aeec;
}

    <script>
var Aide = (() => {
  const members = ['林溪', '陈默', '周宁', '许安'];
  const definitions = [
    ['understand', '需求理解', '需求理解', [], 20, 96],
    ['plan', '技术方案', '技术方案', ['understand'], 210, 96],
    ['orders', '订单明细开发', '数据开发', ['plan'], 400, 16],
    ['refunds', '退款处理开发', '数据开发', ['plan'], 400, 96],
    ['schedule', '调度配置', '数据开发', ['plan'], 400, 176],
    ['daily', '渠道日报开发', '数据开发', ['orders', 'refunds'], 590, 56],
    ['test', '数据测试', '数据测试', ['daily', 'schedule'], 780, 96],
    ['publish', '发布上线', '发布上线', ['test'], 970, 96],
  ];
  function message(request, nodeId, author, text) {
    const node = request.nodes.find((n) => n.id === nodeId);
    node.messages.push({ author, text, at: Date.now(), id: `${Date.now()}-${Math.random()}` });
    node.closed = false;
  }
  function event(request, node, type, text, actor = 'Aide') {
    request.events.push({
      node: node.id,
      type,
      text,
      actor,
      at: Date.now(),
      version: node.version,
    });
    message(request, node.id, actor, text);
  }
  function createRequest(title, owner = '林溪', scenario = 'happy') {
    const now = Date.now();
    const request = {
      id: `req-${now}-${Math.random().toString(36).slice(2, 6)}`,
      title,
      owner,
      description:
        '每天 09:00 前获得各渠道支付金额与退款金额，交付订单明细表、渠道交易日报和每日调度任务。',
      createdAt: now,
      deliveredAt: null,
      version: 1,
      flowVersion: 1,
      refundBasis: '',
      historyDays: 30,
      dimension: false,
      scenario,
      fixed: false,
      paused: false,
      draft: false,
      events: [],
      nodes: definitions.map(([id, name, category, deps, x, y]) => ({
        id,
        name,
        category,
        deps: [...deps],
        x,
        y,
        owner,
        status: id === 'understand' ? 'waiting' : 'idle',
        version: 1,
        batch: 0,
        startedAt: id === 'understand' ? now : null,
        endedAt: null,
        reviews: [],
        reviewHistory: [],
        transfer: null,
        messages: [],
        seen: {},
        drafts: {},
        closed: false,
      })),
    };
    message(
      request,
      'understand',
      '林溪',
      '运营希望每天 09:00 前看到渠道交易日报，请先确认退款的统计日期。',
    );
    message(
      request,
      'understand',
      'Aide',
      '已整理业务目标。退款按发生日反映当天资金变动；按订单日反映订单批次。请明确口径再继续。',
    );
    return request;
  }
  function seed() {
    const channel = createRequest('渠道交易日报建设');
    const delivered = createRequest('会员复购分析宽表');
    delivered.createdAt -= 2 * 86400000;
    delivered.deliveredAt = Date.now() - 86400000;
    delivered.nodes.forEach((n) => {
      n.status = 'done';
      n.startedAt = delivered.createdAt;
      n.endedAt = delivered.deliveredAt;
      n.closed = true;
    });
    const active = createRequest('商品库存预警明细');
    active.refundBasis = 'refund';
    active.nodes[0].status = 'done';
    active.nodes[1].status = 'waiting';
    active.nodes[1].startedAt = Date.now() - 600000;
    message(active, 'plan', 'Aide', '示例方案已生成，等待林溪审阅。');
    const draft = createRequest('新客转化漏斗');
    draft.draft = true;
    draft.nodes[0].messages = [];
    return { schema: 1, member: '林溪', requests: [channel, active, delivered, draft] };
  }
  function actionable(request, member) {
    if (request.paused || request.deliveredAt || request.draft) return [];
    return request.nodes.filter(
      (n) =>
        n.transfer?.to === member ||
        n.reviews.some((r) => r.reviewer === member && r.status === 'pending') ||
        (n.owner === member && ['waiting', 'failed'].includes(n.status) && !n.transfer),
    );
  }
  function status(request, member) {
    if (request.draft) return '草稿';
    if (request.deliveredAt) return '已交付';
    if (request.paused) return '已暂停';
    if (actionable(request, member).length) return '待我处理';
    if (request.nodes.some((n) => n.status === 'failed')) return '受阻';
    const waiting = request.nodes.find((n) => n.status === 'waiting');
    if (waiting)
      return `等待${waiting.transfer?.to || waiting.reviews.find((r) => r.status === 'pending')?.reviewer || waiting.owner}`;
    return '运行中';
  }
  const duration = (ms) =>
    ms < 60000
      ? `${Math.max(0, Math.floor(ms / 1000))} 秒`
      : ms < 3600000
        ? `${Math.floor(ms / 60000)} 分 ${Math.floor(ms / 1000) % 60} 秒`
        : `${Math.floor(ms / 3600000)} 小时 ${Math.floor(ms / 60000) % 60} 分`;
  const escape = (input) =>
    String(input ?? '').replace(
      /[&<>"']/g,
      (s) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[s],
    );
  return { members, createRequest, seed, message, event, actionable, status, duration, escape };
})();

      review,
      reviewDecision,
      revise,
      validateFlow,
      addCheck,
      start,

      [48 + r * Math.cos(angle), 48 + r * Math.sin(angle)].map((v) => v.toFixed(2)).join(' ');
    const a = start * Math.PI * 2 - Math.PI / 2;
    const b = (start + Math.min(fraction, 0.999999)) * Math.PI * 2 - Math.PI / 2;
    const large = fraction > 0.5 ? 1 : 0;

  function enrich(snapshot, now = Date.now()) {
    snapshot.requests.forEach((r) => {
      r.nodes.forEach((n, i) => {
        n.x = i * 20;
        n.color = colors[n.status] || colors.idle;
        n.statusText = statusNames[n.status] || n.status;

      r.ageDays = Math.max(0, Math.floor((now - r.createdAt) / day));

    });

      const rows = snapshot.requests.filter((r) => !mine || r.owner === snapshot.member);
      const working = rows.filter((r) => !r.draft);
      const active = working.filter((r) => r.active);
      const nodes = working.flatMap((r) => r.nodes);
      const maxStage = Math.max(
        1,
        ...snapshot.stages.map((stage) => active.filter((r) => r.stage === stage.title).length),
      );
      const stages = snapshot.stages.map((stage) => {
        const count = active.filter((r) => r.stage === stage.title).length;
        return {
          title: stage.title,
          count,
          width: (count / maxStage) * 240,
          label: `${count} 个需求`,
        };
      });
      const owners = Aide.members.map((owner) => {
        const owned = working.filter((r) => r.owner === owner);
        const ownedNodes = owned.flatMap((r) => r.nodes);
        const done = ownedNodes.filter((n) => n.status === 'done').length;
        return {
          title: owner,
          total: owned.length,
          active: owned.filter((r) => r.active).length,
          delivered: owned.filter((r) => r.deliveredAt).length,
          waiting: ownedNodes.filter((n) => n.status === 'waiting').length,
          failed: ownedNodes.filter((n) => n.status === 'failed').length,
          progress: ownedNodes.length ? Math.round((done / ownedNodes.length) * 100) : 0,
        };
      });
      const statusCounts = [
        ['推进中', active.filter((r) => !r.blocked && !r.paused).length],
        ['受阻', active.filter((r) => r.blocked && !r.paused).length],
        ['已交付', rows.filter((r) => r.deliveredAt).length],
        ['草稿', rows.filter((r) => r.draft).length],
        ['已暂停', active.filter((r) => r.paused).length],
      ];
      let offset = 0;
      const statuses = statusCounts.map(([title, count]) => {
        const fraction = rows.length ? count / rows.length : 0;
        const item = { title, count, path: donut(offset, fraction) };
        offset += fraction;
        return item;
      });
      const dates = Array.from({ length: days }, (_, i) => dateKey(now - (days - i - 1) * day));
      const trend = dates.map((key, i) => ({
        date: key,
        label: key.slice(5),
        x: 12 + (i * 456) / Math.max(1, days - 1),
        created: working.filter((r) => r.createdAt <= now && dateKey(r.createdAt) === key).length,
        delivered: working.filter(
          (r) => r.deliveredAt && r.deliveredAt <= now && dateKey(r.deliveredAt) === key,
        ).length,
      }));
      const max = Math.max(1, ...trend.flatMap((p) => [p.created, p.delivered]));
      trend.forEach((p) => {
        p.createdY = 118 - (p.created / max) * 92;
        p.deliveredY = 118 - (p.delivered / max) * 92;
        p.height = (p.delivered / max) * 92;
        p.y = 118 - p.height;
        p.barWidth = Math.max(4, 320 / days);
        p.barX = Math.min(480 - p.barWidth, Math.max(0, p.x - p.barWidth / 2));
      });
      const path = (field) =>
        trend.map((p, i) => `${i ? 'L' : 'M'}${p.x.toFixed(2)} ${p[field].toFixed(2)}`).join(' ');
      const delivered = trend.reduce((sum, p) => sum + p.delivered, 0);
      const previousStart = dateKey(now - (days * 2 - 1) * day),
        previousEnd = dateKey(now - days * day);
      const previous = working.filter(
        (r) =>
          r.deliveredAt &&
          dateKey(r.deliveredAt) >= previousStart &&
          dateKey(r.deliveredAt) <= previousEnd,
      ).length;
      const calendar = Array.from({ length: 30 }, (_, i) => {
        const key = dateKey(now - (29 - i) * day);
        const count = snapshot.eventsAll.filter(
          (ev) => dateKey(ev.at) === key && (!mine || rows.some((r) => r.id === ev.requestId)),
        ).length;
        return {
          date: key,
          count,
          color: ['#f0f2f9', '#dce0fb', '#afb8ef', '#8590e7', '#5662dc'][
            Math.min(4, Math.ceil(count / 3))
          ],
          x: (i % 15) * 22,
          y: Math.floor(i / 15) * 24,
          label: `${key} · ${count} 次事件`,
        };
      });
      const nodeStates = Object.keys(statusNames).map((status) => ({
        title: statusNames[status],
        count: nodes.filter((n) => n.status === status).length,
        color: colors[status],
        width: nodes.length
          ? (nodes.filter((n) => n.status === status).length / nodes.length) * 100
          : 0,
      }));
      return {
        days,
        total: rows.length,
        active: active.length,
        blocked: active.filter((r) => r.blocked).length,
        delivered,
        created: trend.reduce((sum, p) => sum + p.created, 0),
        previous,
        change: previous
          ? `${delivered >= previous ? '+' : ''}${Math.round(((delivered - previous) / previous) * 100)}%`
          : '上期无交付',
        nodes: nodes.length,
        completedNodes: nodes.filter((n) => n.status === 'done').length,
        failedNodes: nodes.filter((n) => n.status === 'failed').length,
        waitingNodes: nodes.filter((n) => n.status === 'waiting').length,
        completion: nodes.length
          ? Math.round((nodes.filter((n) => n.status === 'done').length / nodes.length) * 100)
          : 0,
        avgProgress: working.length
          ? Math.round(working.reduce((sum, r) => sum + r.progress, 0) / working.length)
          : 0,
        startLabel: dates[0],
        endLabel: dates.at(-1),
        max,
        trend,
        createdPath: path('createdY'),
        deliveredPath: path('deliveredY'),
        areaPath: `${path('deliveredY')} L468 118 L12 118 Z`,
        stages,
        owners,
        statuses,
        calendar,
        nodeStates,
        todos: snapshot.todos.filter((n) => rows.some((r) => r.id === n.requestId)),
        reviews: snapshot.reviews.filter((n) => rows.some((r) => r.id === n.requestId)),
        events: snapshot.events.filter((ev) => rows.some((r) => r.id === ev.requestId)),
      };
    }
    snapshot.insights = {
      project7: scope(false, 7),
      project30: scope(false, 30),
      mine7: scope(true, 7),
      mine30: scope(true, 30),
    };
    delete snapshot.eventsAll;
    return snapshot;
  }
  return { populate, enrich };
})();

var AidePersonal = (() => {
  const limit = 150000;
  const svgAttributes = ['width', 'height', 'x', 'y', 'd', 'fill', 'title', 'aria-label'];
  function page(db, member = db.member) {
    db.personalPages ||= {};
    if (!Object.hasOwn(db.personalPages, member))
      db.personalPages[member] = { source: '', prompt: '', history: [], revision: 0 };
    return db.personalPages[member];
  }
  function validate(source) {
    if (typeof source !== 'string') throw Error('请提供 HTML/CSS 源码。');
    if (source.length > limit) throw Error('页面源码不能超过 150000 字符。');
    if (!source.trim() || !/<[a-z]/i.test(source))
      throw Error('请提供包含页面内容的 HTML/CSS 源码。');
    if (/<\s*script\b/i.test(source) || /javascript\s*:/i.test(source))
      throw Error(
        '此版接受 HTML/CSS，不执行自定义 JavaScript。动态数据请使用 data-aide 数据绑定。',
      );
    if (/\son\w+\s*=/i.test(source)) throw Error('请移除内联事件，需求跳转使用 data-aide-open。');
    if (/<\s*(iframe|object|embed|form)\b/i.test(source))
      throw Error('不支持外部嵌入或表单；请使用普通 HTML/CSS。');
    if (/<\s*(meta|base)\b/i.test(source))
      throw Error('请移除 meta/base 跳转或策略标签；保留页面 HTML/CSS 即可。');
    return source.trim();
  }
  function apply(db, member, source, prompt = '') {
    const clean = source ? validate(source) : '';
    const current = page(db, member);
    if (current.source === clean && current.prompt === prompt) return;
    current.history.push({ source: current.source, prompt: current.prompt, at: Date.now() });
    current.history = current.history.slice(-8);
    current.source = clean;
    current.prompt = String(prompt).slice(0, 2000);
    current.revision++;
    current.updatedAt = Date.now();
  }
  function undo(db, member) {
    const current = page(db, member),
      previous = current.history.pop();
    if (!previous) throw Error('没有可撤销的保存版本。');
    Object.assign(current, previous, { revision: current.revision + 1, updatedAt: Date.now() });
  }
  function snapshot(db) {
    const now = Date.now(),
      member = db.member;
    const date = (at) =>
      at ? new Date(at).toLocaleDateString('zh-CN', { timeZone: 'Asia/Shanghai' }) : '—';
    const requests = db.requests.map((r) => {
      const nodes = r.nodes.map((n) => ({
        id: n.id,
        title: n.name,
        owner: n.owner,
        category: n.category,
        status: n.status,
        version: n.version,
        requestId: r.id,
        requestTitle: r.title,
        reason:
          n.status === 'failed'
            ? '执行失败，需要检查成果并修复'
            : n.transfer
              ? `等待${n.transfer.to}接手`
              : n.reviews.some((v) => v.status === 'pending')
                ? '当前版本等待评审'

                  ? '成果等待确认'
                  : '自动依赖推进',
      }));
      const completed = nodes.filter((n) => n.status === 'done').length;
      return {
        id: r.id,
        title: r.title,
        owner: r.owner,
        status: Aide.status(r, member),
        stage: r.deliveredAt
          ? '已交付'
          : nodes.find((n) => n.status !== 'done')?.category || '已完成',
        completed,
        total: nodes.length,
        progress: Math.round((completed / nodes.length) * 100),
        progressText: `${completed} / ${nodes.length}`,
        draft: r.draft,
        paused: r.paused,
        active: !r.draft && !r.deliveredAt,
        blocked: nodes.some((n) => n.status === 'failed'),
        deliveredAt: r.deliveredAt,
        createdAt: r.createdAt,
        updatedAt: r.events.at(-1)?.at || r.deliveredAt || r.createdAt,
        date: date(r.deliveredAt || r.createdAt),
        nodes,
        reason:
          nodes.find((n) => n.status === 'failed')?.reason ||

          '依赖自动推进',
      };
    });
    const byId = new Map(requests.map((r) => [r.id, r]));
    const todos = db.requests.flatMap((r) =>
      Aide.actionable(r, member).map((n) => byId.get(r.id).nodes.find((v) => v.id === n.id)),
    );
    const reviews = db.requests
      .filter((r) => !r.draft && !r.deliveredAt)
      .flatMap((r) =>
        r.nodes
          .filter((n) => n.reviews.some((v) => v.status === 'pending'))
          .map((n) => byId.get(r.id).nodes.find((v) => v.id === n.id)),
      );
    const deliveries = requests
      .filter((r) => r.deliveredAt)
      .sort((a, b) => b.deliveredAt - a.deliveredAt);
    const inDays = (days, mine = false) =>
      deliveries.filter(
        (r) =>
          (!mine || r.owner === member) &&
          r.deliveredAt >= now - days * 86400000 &&
          r.deliveredAt <= now,
      ).length;
    const eventsAll = db.requests
      .flatMap((r) =>
        r.events.map((event) => ({
          title: event.text,
          actor: event.actor,
          date: date(event.at),
          at: event.at,
          requestId: r.id,
          requestTitle: r.title,
        })),
      )
      .sort((a, b) => b.at - a.at);
    const events = eventsAll.slice(0, 30);
    const blocked = requests.filter((r) => r.active && r.blocked);
    const stages = ['需求理解', '技术方案', '数据开发', '数据测试', '发布上线'].map((title) => ({
      title,
      count: requests.filter((r) => r.active && r.stage === title).length,
    }));
    return AidePersonalData.enrich(
      {
        schema: 1,
        member,
        project: '电商数据项目',
        date: date(now),
        updatedAt: now,
        updatedTime: new Date(now).toLocaleTimeString('zh-CN', {
          timeZone: 'Asia/Shanghai',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
        }),
        summary: {
          active: requests.filter((r) => r.active).length,
          todo: todos.length,
          blocked: blocked.length,
          reviews: reviews.length,
          delivered: inDays(7),
          delivered30: inDays(30),
          mineActive: requests.filter((r) => r.active && r.owner === member).length,
          mineDelivered: inDays(7, true),
          mineDelivered30: inDays(30, true),
          total: requests.length,
        },
        requests,
        todos,
        blocked,
        reviews,
        deliveries,
        events,
        eventsAll,
        stages,
        sampleCount: db.requests.filter((r) => r.samplePortfolio).length,
      },
      now,
    );
  }
  function agentPrompt(db, prompt = '') {
    return `请为 Aide 数据开发工作台编写个性化总览。用户目标：${prompt || '按当前成员的工作安排设计首页'}。
直接输出完整 HTML/CSS，布局、排版、色彩、SVG 和内容组织均可自由创造，不需要使用固定组件。仅使用给定数据，不编造统计；不要把示例值硬编码。
使用 <style> 写 CSS。此页面在隔离环境渲染，无外部网络和自定义 JavaScript。
默认与外层工作台保持视觉一致：白色背景，主文字 #242b3d，辅助文字 #8690a3，强调色 #5662dc，边框 #e9edf3；使用 Inter、系统无衬线字体，正文 13px，标题 24px，卡片圆角 8px，间距 16–24px。可自由设计 HTML 结构与布局；只有用户明确要求时才切换整体配色或字体风格。
动态绑定契约：data-aide-text="summary.active" 填文本；data-aide-each="requests" 在该元素内部重复渲染其子元素（条目中用 data-aide-text="title" 等字段）。可嵌套重复 nodes。空列表用 data-aide-empty="暂无事项"。
重复容器可加 data-aide-filter="mine|active|blocked|delivered"、data-aide-sort="updated|progress"、data-aide-limit="6"。
data-aide-open="id"（需求）或 data-aide-open="requestId"（任务）让按钮打开对应需求；任务按钮加 data-aide-node="id"。
data-aide-attr-width="progress" 可绑定 SVG width；可绑定属性：${svgAttributes.join('/')}。自由创造所有 HTML 结构与 CSS，不要写脚本、事件属性、meta/base、iframe、外部资源或表单。
可用根字段 member/project/date/updatedTime/summary；列表 requests/todos/blocked/reviews/deliveries/events/stages。
可视化统计在 insights.project7/project30/mine7/mine30：trend 为北京时间最近 7/30 个自然日的新建与交付；createdPath/deliveredPath/areaPath 可直接绑定 SVG d；stages 为阶段数量和 width；statuses 为数量和环形图 path；owners 为成员负载；calendar 为最近 30 天完整工作事件的 x/y/color/label；nodeStates 为节点状态数量与 width/color。统计均从需求、节点与事件计算，不是模型估算。需求 nodes 提供 x/color/statusText，可自由创作进度矩阵。
示例：<section data-aide-each="todos" data-aide-empty="全部处理完成"><article><h2 data-aide-text="title"></h2><p data-aide-text="requestTitle"></p><button data-aide-open="requestId" data-aide-node="id">去处理</button></article></section>
当前数据样本（虚构演示数据，实际显示由工作台每次注入最新快照）：
${JSON.stringify(snapshot(db), null, 2)}
请仅返回 HTML 源码，用户会在“个性化 → HTML/CSS”中粘贴、预览并保存。`;
  }
  return { page, validate, apply, undo, snapshot, agentPrompt, svgAttributes };
})();

    <script>
var AidePersonalRuntime = (() => {
  // User HTML supplies presentation; this platform-owned bridge alone can execute.
  function bridge(svgAttributes) {
    const original = [...document.body.childNodes].map((n) => n.cloneNode(true));
    let snapshot;
    const send = (type, rest = {}) => parent.postMessage({ aidePersonal: 1, type, ...rest }, '*');
    const height = () => send('height', { height: document.documentElement.scrollHeight });
    function draw(data) {
      snapshot = data;
      let budget = 3000;
      const missing = new Set();
      const read = (scope, path) => {
        const parts = String(path).split('.');
        if (parts.some((p) => ['__proto__', 'constructor', 'prototype'].includes(p)))
          return undefined;
        const get = (object) =>
          parts.reduce(
            (current, key) => (current && Object.hasOwn(current, key) ? current[key] : undefined),
            object,
          );
        const result = get(scope) ?? get(snapshot);
        if (result === undefined) missing.add(path);
        return result;
      };
      function bind(element, scope, depth = 0) {
        if (element.nodeType !== 1 || budget-- <= 0) return;
        const each = element.getAttribute('data-aide-each');
        if (each && depth < 5) {
          let items = read(scope, each);
          if (!Array.isArray(items)) items = [];
          const filters = (element.getAttribute('data-aide-filter') || '').split(',');
          filters.forEach((filter) => {
            if (filter === 'mine') items = items.filter((item) => item.owner === snapshot.member);
            if (filter === 'active') items = items.filter((item) => item.active);
            if (filter === 'blocked') items = items.filter((item) => item.blocked);
            if (filter === 'delivered') items = items.filter((item) => item.deliveredAt);
          });
          const sort = element.getAttribute('data-aide-sort');
          if (sort)
            items = items
              .slice()
              .sort((a, b) =>
                sort === 'progress' ? b.progress - a.progress : b.updatedAt - a.updatedAt,
              );
          items = items.slice(
            0,
            Math.max(0, Math.min(100, Number(element.getAttribute('data-aide-limit') || 20))),
          );
          const children = [...element.childNodes];
          element.replaceChildren();
          for (const item of items)
            for (const child of children) {
              if (budget <= 0) break;
              const clone = child.cloneNode(true);
              element.append(clone);
              bind(clone, item, depth + 1);
            }
          if (!items.length) {
            const empty = document.createElement('p');
            empty.className = 'empty';
            empty.textContent = element.getAttribute('data-aide-empty') || '暂无数据';
            element.append(empty);
          }
          return;
        }
        const path = element.getAttribute('data-aide-text');
        if (path) element.textContent = String(read(scope, path) ?? '—');
        for (const attr of svgAttributes) {
          const binding = element.getAttribute(`data-aide-attr-${attr}`);
          if (binding) element.setAttribute(attr, String(read(scope, binding) ?? ''));
        }
        const open = element.getAttribute('data-aide-open');
        if (open) {
          element.dataset.boundOpen = String(read(scope, open) || '');
          const node = element.getAttribute('data-aide-node');
          if (node) element.dataset.boundNode = String(read(scope, node) || '');
        }
        if (!path) for (const child of element.children) bind(child, scope, depth);
      }
      document.body.replaceChildren(...original.map((n) => n.cloneNode(true)));
      for (const element of document.body.children) bind(element, snapshot);
      send('bound', { missing: [...missing].slice(0, 10) });
      requestAnimationFrame(height);
    }
    window.addEventListener('message', (event) => {
      if (event.source === parent && event.data?.aidePersonal === 1 && event.data.type === 'data')
        draw(event.data.snapshot);
    });
    document.addEventListener('click', (event) => {
      if (event.target.closest('a')) event.preventDefault();
      const button = event.target.closest('[data-bound-open]');
      if (button) send('open', { id: button.dataset.boundOpen, node: button.dataset.boundNode });
    });
    new ResizeObserver(height).observe(document.body);
    send('ready');
  }
  function documentFor(source) {
    AidePersonal.validate(source);
    const parsed = new DOMParser().parseFromString(source, 'text/html');
    parsed
      .querySelectorAll('script,iframe,object,embed,form,meta,base,link')
      .forEach((n) => n.remove());
    parsed.querySelectorAll('*').forEach((element) => {
      for (const attr of [...element.attributes]) {
        if (
          /^on/i.test(attr.name) ||
          ['srcset', 'action', 'formaction', 'nonce'].includes(attr.name)
        )
          element.removeAttribute(attr.name);
        if (['href', 'xlink:href'].includes(attr.name) && !attr.value.startsWith('#'))
          element.removeAttribute(attr.name);
        if (
          attr.name === 'src' &&
          !(
            element.tagName === 'IMG' &&
            /^data:image\/(png|jpeg|gif|webp);base64,/i.test(attr.value)
          )
        )
          element.removeAttribute(attr.name);

    });

      n.toString(16).padStart(2, '0'),
    ).join('');
    const policy = `default-src 'none'; script-src 'nonce-${nonce}'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'`;

    return `<!doctype html><html><head><meta http-equiv="Content-Security-Policy" content="${policy}"><style>html{overflow-x:hidden}body{min-height:0}button:focus-visible{outline:3px solid #9cacf0}</style>${parsed.head.innerHTML}</head><body>${parsed.body.innerHTML}</body><script nonce="${nonce}">(${bridge.toString()})(${JSON.stringify(AidePersonal.svgAttributes)})<\/script></html>`;
  }
  function mount(db, ui) {
    document.querySelectorAll('iframe[data-personal-frame]').forEach((frame) => {
      const source =
        frame.dataset.personalFrame === 'preview'
          ? ui.personal?.previewSource
          : AidePersonal.page(db).source;
      if (!source) return;
      try {
        frame.srcdoc = documentFor(source);
      } catch (error) {
        frame.replaceWith(
          Object.assign(document.createElement('p'), {
            className: 'error-text',
            textContent: error.message,
          }),
        );
      }
    });
  }
  function sync(db) {
    const snapshot = AidePersonal.snapshot(db);
    document
      .querySelectorAll('iframe[data-personal-frame]')
      .forEach((frame) =>
        frame.contentWindow?.postMessage({ aidePersonal: 1, type: 'data', snapshot }, '*'),
      );
  }
  function receive(event, db, ui, helpers) {
    const frame = [...document.querySelectorAll('iframe[data-personal-frame]')].find(
      (candidate) => candidate.contentWindow === event.source,
    );
    if (!frame || event.data?.aidePersonal !== 1) return;
    const message = event.data;
    if (message.type === 'ready') sync(db);
    if (message.type === 'height' && frame.dataset.personalFrame === 'overview')
      frame.style.height = `${Math.max(480, Math.min(4000, Number(message.height) || 480))}px`;
    if (message.type === 'bound' && frame.dataset.personalFrame === 'preview') {
      const status = document.getElementById('personal-binding-status');
      if (status) {
        const missing = Array.isArray(message.missing) ? message.missing.map(String) : [];
        status.textContent = missing.length
          ? `字段未找到：${missing.join('、')}`
          : '数据已连接 · 数字和条目来自当前工作台';
        status.classList.toggle('error-text', missing.length > 0);
      }
    }
    if (message.type === 'open') {
      if (frame.dataset.personalFrame === 'preview')
        return helpers.toast('预览中的链接已绑定；保存后可进入需求。');
      const request = db.requests.find((r) => r.id === message.id);
      if (!request) return helpers.toast('此需求已不存在，请重新生成或检查绑定。');
      request.draft = false;
      ui.requestId = request.id;
      ui.nodeId = request.nodes.some((n) => n.id === message.node)
        ? message.node
        : Aide.actionable(request, db.member)[0]?.id ||
          (request.deliveredAt
            ? 'publish'
            : request.nodes.find((n) => n.status !== 'done')?.id || 'understand');
      helpers.render();
      window.scrollTo(0, 0);
    }
  }
  return { mount, sync, receive };
})();

    new Date(time).toLocaleDateString('zh-CN', {

      timeZone: 'Asia/Shanghai',
      hour: '2-digit',
      minute: '2-digit',

  const dayKey = (time) =>
    new Date(time).toLocaleDateString('en-CA', { timeZone: 'Asia/Shanghai' });
  function pill(text) {
    return `<span class="pill ${text === '已交付' || text === '已完成' ? 'green' : text === '受阻' || text === '失败' ? 'red' : text === '运行中' ? 'amber' : text === '草稿' || text === '已暂停' ? '' : 'blue'}">${e(text)}</span>`;
  }
  function shell(db, ui, content) {
    const count = db.requests.reduce((sum, r) => sum + Aide.actionable(r, db.member).length, 0);
    return `<div class="app-shell"><aside class="sidebar"><div class="logo"><span class="logo-mark">a</span>Aide<span class="tiny muted" style="letter-spacing:0;margin-top:6px">工作台</span></div><div class="nav-label">WORKSPACE</div>${[
      ['overview', 'grid', '总览'],
      ['all', 'list', '全部需求'],
      ['sessions', 'chat', '协作记录'],
    ]
      .map(
        ([id, glyph, name]) =>
          `<button class="nav-item ${ui.tab === id && !ui.requestId ? 'active' : ''}" data-action="nav" data-id="${id}">${icon(glyph)}${name}${id === 'all' ? `<span class="nav-count">${db.requests.length}</span>` : ''}</button>`,
      )
      .join(
        '',
      )}<div class="nav-label">CURRENT PROJECT</div><div class="project-card"><div class="flex">${icon('folder')}电商数据项目</div><p class="tiny muted" style="margin-top:8px">示例空间 · 北京时间</p></div><div class="side-footer"><div class="flex">${avatar('Aide')}<div><h3>Aide 助手</h3><p class="tiny muted">与你一起完成数据交付</p></div></div><p class="brand-note" style="margin-top:15px">让想法成为可靠的数据。</p></div></aside><div class="main"><header class="topbar"><div class="breadcrumb">工作空间 <span style="margin:0 11px">/</span><span>${ui.requestId ? '需求交付' : '数据开发工作台'}</span></div><div class="flex"><span class="pill">◉ 演示模式</span><span class="tiny muted">待办 ${count}</span><span class="muted">│</span>${avatar(db.member)}<select class="member-select" id="member" aria-label="切换演示成员">${Aide.members.map((name) => `<option ${name === db.member ? 'selected' : ''}>${name}</option>`).join('')}</select></div></header>${content}</div></div>`;
  }
  function filtered(db, ui) {
    return db.requests.filter((r) => {
      if (ui.search && !r.title.includes(ui.search)) return false;

      if (ui.filter === 'todo') return Aide.actionable(r, db.member).length > 0;
      if (ui.filter === 'delivered') return inRange(r, ui);
      if (ui.filter?.startsWith('day:'))
        return r.deliveredAt && dayKey(r.deliveredAt) === ui.filter.slice(4);
      if (ui.filter?.startsWith('stage:'))
        return (
          !r.deliveredAt &&
          !r.draft &&
          r.nodes.find((n) => n.status !== 'done')?.category === ui.filter.slice(6)
        );
      return true;
    });
  }
  function inRange(r, ui) {
    return (
      r.deliveredAt &&
      r.deliveredAt >= Date.now() - Number(ui.range || 7) * 86400000 &&
      r.deliveredAt <= Date.now()
    );
  }
  function requestRows(requests, member) {
    return requests
      .map((r) => {
        const next = Aide.actionable(r, member)[0] || r.nodes.find((n) => n.status !== 'done');
        const completed = r.nodes.filter((n) => n.status === 'done').length;
        return `<tr><td><button class="stat-click req-name" data-action="open" data-id="${r.id}">${e(r.title)}</button><div class="req-desc">${r.draft ? '需求草稿，等待补充' : next ? e(next.name) : '成果与验收证据已归档'}</div></td><td>${pill(Aide.status(r, member))}</td><td><span class="muted">${completed} / ${r.nodes.length}</span><div class="progress"><span style="width:${(completed / r.nodes.length) * 100}%"></span></div></td><td><div class="flex">${avatar(r.owner)}<span class="muted">${r.owner}</span></div></td><td class="muted tiny">${date(r.deliveredAt || r.createdAt)}</td><td><button class="text-button tiny" data-action="open" data-id="${r.id}" data-node="${next?.id || 'publish'}">${r.deliveredAt ? '查看成果' : next?.id === 'understand' ? '确认退款口径' : '查看任务'} ${icon('arrow')}</button></td></tr>`;
      })
      .join('');
  }
  function chart(db, ui) {
    const span = Number(ui.range || 7),
      total = db.requests.filter((r) => inRange(r, ui)).length;
    const days = Array.from({ length: span }, (_, i) => Date.now() - (span - 1 - i) * 86400000);
    const counts = days.map(
      (day) =>
        db.requests.filter((r) => r.deliveredAt && dayKey(r.deliveredAt) === dayKey(day)).length,
    );
    const max = Math.max(2, ...counts),
      points = counts.map((count, i) => [30 + (i * 465) / (span - 1), 130 - (count / max) * 100]);
    return `<div class="panel"><div class="panel-heading"><h2>交付趋势 <span class="tiny muted" style="font-weight:400;margin-left:8px">最近 ${span} 天</span></h2><span class="tiny muted">本期 <strong style="color:#626fe0">${total}</strong> 个需求</span></div><svg class="chart" viewBox="0 0 525 166" role="img" aria-label="交付趋势，总计${total}个"><defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ca5f1" stop-opacity=".18"/><stop offset="1" stop-color="#9ca5f1" stop-opacity="0"/></linearGradient></defs>${[0, 1, 2].map((i) => `<line class="gridline" x1="28" x2="503" y1="${130 - i * 50}" y2="${130 - i * 50}"/><text x="7" y="${134 - i * 50}">${Math.round((i * max) / 2)}</text>`).join('')}<path d="M${points.map((p) => p.join(',')).join(' L')} L495,130 L30,130 Z" fill="url(#area)"/><path class="trend" d="M${points.map((p) => p.join(',')).join(' L')}"/>${points.map(([x, y], i) => `<circle tabindex="0" role="button" aria-label="${date(days[i])}交付${counts[i]}个" data-action="filter" data-id="day:${dayKey(days[i])}" cx="${x}" cy="${y}" r="3.7"><title>${date(days[i])}：${counts[i]} 个交付</title></circle>${span === 7 || i % 5 === 0 || i === span - 1 ? `<text text-anchor="middle" x="${x}" y="156">${date(days[i])}</text>` : ''}`).join('')}</svg></div>`;
  }
  function distribution(db) {
    const active = db.requests.filter((r) => !r.deliveredAt && !r.draft),
      cats = ['需求理解', '技术方案', '数据开发', '数据测试', '发布上线'];
    const colors = ['#858de7', '#a9b3ee', '#c9cff2', '#a0cabf', '#b5c0d6'];
    let start = 0;

ss="text-button" data-action="clear-filter">清空筛选</button></div>` : ''}${ui.tab === 'sessions' ? sessions(db, ui) : `<table><thead><tr><th style="width:30%">需求名称 / 当前任务</th><th>状态</th><th>完成进度</th><th>负责人</th><th>更新时间</th><th>下一步</th></tr></thead><tbody>${requestRows(filtered(db, ui), db.member)}</tbody></table>${!filtered(db, ui).length ? '<div class="empty">暂无匹配需求，清空筛选或新建需求。</div>' : ''}`}</section><div class="session-summary">${icon('chat')}<span>会话情况</span><span>待回复 <strong>${threads.filter((t) => t.n.status === 'waiting').length}</strong></span><span>处理中 <strong>${threads.filter((t) => t.n.status !== 'waiting').length}</strong></span><span>未读 <strong>${threads.filter((t) => t.n.messages.length > (t.n.seen[db.member] || 0)).length}</strong></span><button class="text-button tiny" data-action="nav" data-id="sessions">查看协作记录 →</button></div><p class="bottom-note">演示数据 · AI、测试执行、发布与首跑均为本地模拟 · 状态自动保存在当前浏览器</p></main>`;
  }
  function sessions(db, ui) {
    return `<table><thead><tr><th>话题 / 关联需求</th><th>参与者</th><th>最近消息</th><th>状态</th><th>未读</th></tr></thead><tbody>${db.requests
      .filter((r) => !ui.search || r.title.includes(ui.search))
      .flatMap((r) =>
        r.nodes
          .filter((n) => n.messages.length)
          .map(
            (n) =>
              `<tr><td><button class="stat-click req-name" data-action="open" data-id="${r.id}" data-node="${n.id}">${n.name}</button><div class="req-desc">${e(r.title)}</div></td><td class="muted">${e([...new Set(n.messages.map((m) => m.author))].join('、'))}</td><td class="muted">${e(n.messages.at(-1).text.slice(0, 45))}…</td><td>${pill(n.closed ? '已结束' : '进行中')}</td><td class="muted">${Math.max(0, n.messages.length - (n.seen[db.member] || 0))}</td></tr>`,
          ),
      )
      .join('')}</tbody></table>`;
  }
  return { e, icon, avatar, date, clock, dayKey, pill, shell, workspace };
})();

var AidePersonalUI = (() => {

                '',
              )}</div><details><summary>查看当前 JSON 数据</summary><pre class="personal-json">${e(JSON.stringify(snapshot, null, 2))}</pre></details><p class="notice">原型只提供虚构工作台数据，不包含真实业务数据或成员聊天内容。</p>`
          : `<div class="personal-agent"><div class="personal-data-banner"><div><strong>${snapshot.sampleCount ? `已补充 ${snapshot.sampleCount} 条虚构需求` : '让图表有更多可展示的数据'}</strong><p>保留已有需求，补充 24 条历史交付与在途示例。</p></div><button data-action="personal-data" ${snapshot.sampleCount ? 'disabled' : ''}>${snapshot.sampleCount ? '已加载' : '补充演示数据'}</button></div><div class="flex">${AideUI.avatar('Aide')}<div><h3>让首页适应你的工作</h3><p class="tiny muted">直接编写 HTML/CSS · 演示生成</p></div></div><p class="personal-agent-response">${e(draft.summary)}</p><div class="personal-examples">${AidePersonalGenerate.examples.map((prompt, i) => `<button data-action="personal-example" data-id="${i}"><strong>${e(AidePersonalGenerate.labels[i])}</strong><span>趋势 · 进度 · 数据分布 →</span></button>`).join('')}</div><label for="personal-prompt">描述页面，或继续提出修改</label><textarea id="personal-prompt" maxlength="2000" placeholder="比如：做成杂志式简报，突出今天需要我决策的事…">${e(draft.prompt)}</textarea><button class="primary" data-action="personal-generate">${AideUI.icon('spark')} 生成演示草稿</button><p class="tiny muted">本地规则生成风格示例，尚未接入真实大模型。每次生成会重写整份草稿；已有手动修改请先导出。</p><div class="external-agent-note"><h3>交给你自己的 Agent</h3><p>复制目标、数据样本与绑定契约给 Codex / Claude，自由编写页面，再到“HTML/CSS”粘贴或导入结果。</p><button data-action="personal-agent-prompt">复制 Agent 任务与数据契约</button></div></div>`;
    return `<div class="overlay personal-overlay"><section class="personal-designer" role="dialog" aria-modal="true" aria-label="个性化总览"><header class="personal-designer-header"><div><div class="eyebrow">MAKE IT YOURS</div><h2>个性化总览 <span class="pill">${e(db.member)}的首页</span></h2><p class="subtitle">告诉 Agent 你想关注什么，让它重新设计整页。</p></div><button class="text-button" data-action="personal-close" aria-label="关闭个性化">${AideUI.icon('close')}</button></header><div class="personal-designer-body"><aside class="personal-compose"><div class="personal-tabs">${[
      ['ask', '描述目标'],
      ['code', 'HTML/CSS'],
      ['data', '数据来源'],
    ]
      .map(
        ([id, label]) =>
          `<button data-action="personal-tab" data-id="${id}" class="${draft.tab === id ? 'active' : ''}">${label}</button>`,
      )
      .join(
        '',
      )}</div><div class="personal-compose-content">${body}</div></aside><div class="personal-canvas"><div class="personal-canvas-heading"><span><i class="live-dot"></i> 实时数据预览</span><span class="pill ${stale ? 'amber' : ''}" id="personal-preview-state">${stale ? '源码有未预览修改' : '未应用的草稿'}</span><button class="text-button tiny" data-action="personal-export">导出 HTML 源码</button></div><iframe class="personal-preview" data-personal-frame="preview" sandbox="allow-scripts" title="个性化页面预览"></iframe><div class="personal-binding-status" id="personal-binding-status">正在连接工作台数据…</div></div></div><footer class="personal-designer-footer"><span class="tiny muted">${saved.source ? `当前保存版本 V${saved.revision} · ` : ''}保存仅修改 ${e(db.member)} 的首页 · 演示数据保存在当前浏览器</span><div class="toolbar"><button data-action="personal-undo" ${saved.history.length ? '' : 'disabled'}>撤销上次保存</button><button data-action="personal-close">取消</button><button class="primary" data-action="personal-save" ${stale ? 'disabled' : ''}>保存为我的总览</button></div></footer></section></div>`;
  }
  function handle(action, id, db, ui, helpers) {
    if (action === 'personalize') {
      open(db, ui);
      return true;
    }
    if (!action.startsWith('personal-')) return false;
    const draft = ui.personal;
    if (action === 'personal-tab') draft.tab = id;
    if (action === 'personal-close') {
      if (
        (draft.source !== draft.baselineSource || draft.prompt !== draft.baselinePrompt) &&
        !confirm('离开后将放弃这份未保存的页面草稿，已保存总览保留。继续离开？')
      )
        return true;
      ui.drawer = null;
      ui.personal = null;
    }
    if (action === 'personal-example') {
      draft.prompt = AidePersonalGenerate.examples[Number(id)];
      const generated = AidePersonalGenerate.create(draft.prompt);
      draft.source = draft.previewSource = generated.source;
      draft.summary = generated.summary;
    }
    if (action === 'personal-data') {
      const count = AidePersonalData.populate(db);
      draft.summary = count
        ? '已补充 24 条虚构需求：12 条历史交付、12 条在途/草稿，包含受阻与评审。图表从当前数据重新计算。选择一种排版预览。'
        : '演示样本已加载，不会重复添加。';
      helpers.toast(count ? '已补充 24 条虚构演示需求，保留已有需求' : '演示样本已加载');
    }
    if (action === 'personal-generate') {
      const generated = AidePersonalGenerate.create(draft.prompt);
      draft.source = draft.previewSource = generated.source;
      draft.summary = generated.summary;
    }
    if (action === 'personal-preview') {
      draft.previewSource = AidePersonal.validate(draft.source);
      draft.source = draft.previewSource;
      helpers.toast('HTML/CSS 已更新预览；原总览尚未改变');
    }
    if (action === 'personal-save') {
      if (draft.source !== draft.previewSource) throw Error('请先预览最新源码，再保存。');
      AidePersonal.apply(db, db.member, draft.source, draft.prompt);
      ui.drawer = null;
      ui.personal = null;
      ui.tab = 'overview';
      ui.requestId = null;
      helpers.toast('已保存个人总览，刷新后仍然保留');
    }
    if (action === 'personal-reset') {
      AidePersonal.apply(db, db.member, '', '');
      helpers.toast('已恢复默认总览，可撤销');
    }
    if (action === 'personal-undo') {
      AidePersonal.undo(db, db.member);
      if (ui.drawer === 'personalize') open(db, ui);
      helpers.toast('已回到上一个保存版本');
    }
    if (action === 'personal-agent-prompt')
      helpers.copy(AidePersonal.agentPrompt(db, draft.prompt));
    if (action === 'personal-export') {
      const blob = new Blob([draft.source], { type: 'text/html' }),
        url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'aide-personal-overview.html';
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      helpers.toast('已导出页面源码，保留数据绑定，可再次导入');
    }
    return true;
  }
  function input(target, ui) {
    if (!ui.personal) return false;
    if (target.id === 'personal-prompt') {
      ui.personal.prompt = target.value;
      return true;
    }
    if (target.id === 'personal-source') {
      ui.personal.source = target.value;
      const stale = ui.personal.source !== ui.personal.previewSource;
      document.querySelector('[data-action="personal-save"]').disabled = stale;
      document.getElementById('personal-preview-state').textContent = stale
        ? '源码有未预览修改'
        : '未应用的草稿';
      return true;
    }
    return false;
  }
  async function importFile(file, ui, helpers) {
    if (!file || !ui.personal) return;
    const draft = ui.personal;
    try {
      if (file.size > 450000) throw Error('文件过大，请使用不超过 150000 字符的 HTML 源码。');
      const source = AidePersonal.validate(await file.text());
      if (ui.personal !== draft) return;
      draft.source = draft.previewSource = source;
      draft.summary = '已导入外部 Agent 的 HTML/CSS；可继续修改或保存。';
      helpers.render();
      helpers.toast('已导入并预览，点击保存后成为个人总览');
    } catch (error) {
      helpers.toast(error.message);
    }
  }
  return { open, overview, dialog, handle, input, importFile };
})();

</script>
    <script>
Object.assign(
  AideUI,
  (() => {
    const { e, icon, avatar, pill } = AideUI;
    function nodeLabel(node) {
      if (node.transfer) return `待${node.transfer.to}接手`;
      const review = node.reviews.find((r) => r.status === 'pending');
      if (review) return `待${review.reviewer}评审`;
      return {
        idle: '未开始',
        running: '执行中',
        waiting: `待${node.owner}确认`,
        done: '已完成',
        failed: '失败',
      }[node.status];
    }
    function graph(request, ui) {
      return `<svg class="graph ${ui.expanded ? 'expanded' : ''}" viewBox="0 0 1150 260" aria-label="需求依赖 DAG"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9" fill="none" stroke="#bcc8d9"/></marker></defs>${request.nodes
        .flatMap((node) =>
          node.deps.map((id) => {
            const parent = Aide.get(request, id),
              x = parent.x + 153,
              y = parent.y + 32,
              tx = node.x,
              ty = node.y + 32;
            return `<path class="edge ${parent.status === 'done' ? 'satisfied' : ''}" marker-end="url(#arrow)" d="M${x},${y} C${x + 24},${y} ${tx - 24},${ty} ${tx},${ty}"/>`;
          }),
        )
        .join(
          '',
        )}${request.nodes.map((node) => `<g class="${node.status}" tabindex="0" role="button" aria-label="${node.name}，${nodeLabel(node)}" data-action="node" data-id="${node.id}" transform="translate(${node.x},${node.y})">${ui.nodeId === node.id ? '<rect class="selected-ring" x="-3" y="-3" width="159" height="70" rx="8"/>' : ''}<rect class="node-box" width="153" height="64" rx="6"/><text x="12" y="21" class="node-name">${node.name}</text><text x="12" y="38" class="node-state">${node.status === 'done' ? '✓ ' : node.status === 'running' ? '◌ ' : node.status === 'failed' ? '× ' : '○ '}${nodeLabel(node)}</text><text x="12" y="54" class="node-owner">${node.owner} · V${node.version}${node.startedAt ? ` · ${Aide.duration((node.endedAt || request.deliveredAt || Date.now()) - node.startedAt)}` : ''}</text></g>`).join('')}</svg>`;
    }
    function timing(request, ui) {
      const elapsed = (request.deliveredAt || Date.now()) - request.createdAt;
      const node = Aide.get(request, ui.nodeId),
        started = request.nodes.filter((n) => n.startedAt);
      const running = request.nodes.filter((n) => n.status === 'running');
      const selectedEvents = request.events.filter((event) =>
        ui.timeTab === 'node' ? event.node === node.id : true,
      );
      return `<aside class="time-panel"><div class="tabs">${[
        ['overview', '总览'],
        ['node', '节点'],
        ['member', '成员'],
      ]
        .map(
          ([id, label]) =>
            `<button class="tab ${ui.timeTab === id ? 'active' : ''}" data-action="time-tab" data-id="${id}">${label}</button>`,
        )
        .join(
          '',
        )}</div><div class="tiny muted">${ui.timeTab === 'node' ? `${node.name} · 本轮` : '需求总历时'}</div><div class="time-number" data-clock="${ui.timeTab === 'node' ? node.startedAt || Date.now() : request.createdAt}" data-end="${ui.timeTab === 'node' ? node.endedAt || request.deliveredAt || '' : request.deliveredAt || ''}">${Aide.duration(ui.timeTab === 'node' ? (node.endedAt || Date.now()) - (node.startedAt || Date.now()) : elapsed)}</div><div class="tiny muted">${request.deliveredAt ? '已冻结首次交付历时' : request.paused ? '已暂停，等待时间继续累计' : `当前${running.length ? '正在生成成果' : '等待人工处理'}`}</div><div class="time-bar"><span></span><span></span><span></span></div>${
        ui.timeTab === 'member'
          ? Aide.members
              .map((member) => {
                const owned = request.nodes.filter((n) => n.owner === member && n.startedAt),
                  actions = request.events.filter((ev) => ev.actor === member);
                return `<div class="time-row"><span>${member} · ${owned.length} 个负责节点</span><span>${actions.length} 次有效操作</span></div>`;
              })
              .join('')
          : `<div class="time-row"><span>当前里程碑</span><span>${request.deliveredAt ? '交付完成' : Aide.get(request, ui.nodeId).category}</span></div><div class="time-row"><span>已启动节点</span><span>${started.length} / ${request.nodes.length}</span></div><div class="time-row"><span>本节点批次</span><span>${node.batch || 1} · V${node.version}</span></div><div class="time-row"><span>依赖路径</span><span>开发 → 数据测试 → 发布</span></div>`
      }<div class="tiny muted" style="border-top:1px solid #edf0f6;padding-top:11px;margin-top:15px">${ui.timeTab === 'member' ? '协作事件与周期，非实际投入工时' : '近期关键事件'}</div>${
        selectedEvents
          .slice(-3)
          .reverse()
          .map(
            (event) =>
              `<div class="time-event"><button data-action="node" data-id="${event.node}">${AideUI.clock(event.at)} · ${e(event.text.slice(0, 27))}</button></div>`,
          )
          .join('') || '<div class="time-event">确认后开始记录交接与执行事件。</div>'
      }<div class="tiny muted" style="margin-top:13px;line-height:1.7">按创建到交付的墙钟时间计算；并行节点周期不相加。</div></aside>`;
    }
    function nextStep(request, ui, member) {
      const node = Aide.get(request, ui.nodeId);
      let title,
        description,
        label,
        action = 'confirm',
        disabled = false;
      if (request.deliveredAt)
        return `<div class="next-step success"><div><h3>交付完成，所有必需任务与首跑验收均已通过</h3><p>成果已归档 · 看板与交付趋势已同步更新</p></div><button data-action="node" data-id="publish">查看交付成果 ${icon('arrow')}</button></div>`;
      if (request.paused)
        return `<div class="next-step"><div><h3>流程已暂停，已有成果和讨论已保存</h3><p>恢复后继续未完成的自动任务。</p></div><button class="primary" data-action="pause">继续执行</button></div>`;
      if (node.transfer) {
        title = `等待${node.transfer.to}接受${node.name}的转交`;
        description = `当前负责人仍为${node.owner}，接手前不会完成节点或放行下游。`;
        action = 'accept';
        label = '接受转交';
        disabled = member !== node.transfer.to;
      } else if (node.reviews.some((r) => r.status === 'pending')) {
        const own = node.reviews.find((r) => r.reviewer === member && r.status === 'pending');
        title = `V${node.version} 等待${node.reviews
          .filter((r) => r.status === 'pending')
          .map((r) => r.reviewer)
          .join('、')}评审`;
        description = '评审结论与当前产物版本绑定，全部通过后由负责人确认。';
        label = '提交评审结论';
        action = 'review-decision';
        disabled = !own;
      } else if (node.status === 'failed') {
        title =
          node.id === 'publish'
            ? '模拟首跑失败：来源数据未按时就绪'
            : '退款核对失败：发现重复退款流水';
        description =
          node.id === 'publish'
            ? '检查来源就绪后重新授权模拟发布，失败记录会保留。'
            : '生成去重修复候选、重新确认退款产物，再自动重测。';
        action = 'repair';
        label = node.id === 'publish' ? '修复并重新授权' : '生成修复候选';
      } else if (node.status === 'running') {
        title = `${node.name}执行中，正在${node.id === 'publish' ? (node.authorizedVersion ? '模拟发布与首跑验收' : '准备发布包，尚未获得发布授权') : '生成和验证当前版本'}`;
        description = '已完成的独立分支仍可查看，结果就绪后等待人工确认。';
        label = '◌ 执行中';
        disabled = true;
      } else if (node.status === 'idle' || node.status === 'done') {
        const target =
          Aide.actionable(request, member)[0] ||
          request.nodes.find((n) => ['running', 'waiting', 'failed'].includes(n.status));
        title =
          node.status === 'done'
            ? `${node.name}已完成，当前查看的是已保存成果`
            : `${node.name}等待有效上游成果`;
        description = `依赖：${node.deps.map((id) => Aide.get(request, id).name).join('、') || '需求起点'}。实际执行状态始终显示在 DAG。`;
        return `<div class="next-step"><div><h3>${title}</h3><p>${description}</p></div>${target ? `<button class="primary" data-action="node" data-id="${target.id}">前往${target.name}</button>` : ''}</div>`;
      } else {
        const names = {
          understand: ['确认退款归属日期，开始生成技术方案', '确认需求并生成方案'],
          plan: ['审阅方案，采用后启动三条并行开发分支', '采用方案并开始开发'],
          test: ['全部测试通过，请核对当前版本报告', '确认测试结果并继续'],
          publish: ['当前版本测试已通过，请审阅发布包', '确认模拟发布'],
        };
        [title, label] = names[node.id] || [
          'AI 已生成产物，请检查或在协作区提出修改',
          '确认产出并继续',
        ];
        description = `操作者：${node.owner} · ${node.id === 'publish' ? '授权后模拟发布，首跑通过才计入交付。' : '确认当前版本后，有效成果将自动交给下游。'}`;
        disabled = member !== node.owner && member !== request.owner;
        if (node.id === 'understand' && !request.refundBasis) {
          disabled = true;
          description = '请在成果区选择“按退款发生日”或“按订单日”，再确认需求。';
        }
        if (node.reviews.some((r) => r.status === 'changes')) {
          disabled = true;
          description = '评审要求修改，请在协作区提出调整并应用新版本。';
        }
      }
      return `<div class="next-step ${node.status === 'failed' ? 'error' : ''}"><div><h3>${e(title)}</h3><p>${e(description)}${disabled && !['running'].includes(node.status) && node.id !== 'understand' ? ' · 请切换有权限的演示成员' : ''}</p></div><button class="primary" data-action="${action}" ${disabled ? 'disabled' : ''}>${label}</button></div>`;
    }
    function chat(request, node, ui, member) {
      if (ui.chatCollapsed)
        return '<button class="close-chat" data-action="toggle-chat">节点协作 · 展开</button>';
      const canEdit = member === node.owner || member === request.owner;
      const draft = node.drafts[member] || '';
      return `<aside class="panel chat"><div class="chat-header"><div class="flex between"><h2>${icon('chat')} 节点协作 <span class="tiny muted">· ${node.name}</span></h2><button class="text-button tiny" data-action="toggle-chat">收起</button></div><div class="chat-members">${[...new Set([node.owner, ...Aide.members, 'Aide'])].map(avatar).join('')}<span class="tiny muted" style="margin:auto 0 auto 5px">负责人 ${node.owner}</span></div></div><div class="chat-feed">${node.messages.map((m) => `<div class="message ${m.author === 'Aide' ? 'ai-message' : ''}">${avatar(m.author)}<div style="min-width:0"><div class="message-meta"><strong>${m.author}</strong>${m.author === 'Aide' ? 'AI 助手 · ' : ''}${AideUI.clock(m.at)}</div><div class="message-text">${e(m.text)}</div></div></div>`).join('') || '<div class="empty">此节点尚未开始。消息始终归属当前节点。</div>'}${node.suggestion ? `<div class="suggestion"><strong>✦ 修改预览 · 基于 V${node.suggestion.version}</strong><p>${e(node.suggestion.summary)}</p><div class="flex" style="margin-top:10px"><button class="primary tiny" data-action="apply" ${!canEdit || request.deliveredAt ? 'disabled' : ''}>应用到节点</button><button class="text-button tiny" data-action="discard">放弃建议</button></div></div>` : ''}</div><div class="chat-compose"><div class="shortcut">${(node.id === 'understand' ? ['退款按发生日，保留最近30天'] : node.id === 'plan' ? ['增加店铺维度'] : node.id === 'test' ? ['增加渠道日期唯一性检查'] : node.category === '数据开发' ? ['金额补上空值处理'] : ['解释当前发布条件']).map((text) => `<button data-action="prompt" data-id="${text}">${text}</button>`).join('')}</div><textarea id="chat-input" aria-label="节点协作输入" placeholder="与 Aide 讨论，或 @同事补充要求…">${e(draft)}</textarea><div class="compose-footer"><span>模拟 AI · 修改须预览后应用</span><button class="primary tiny" data-action="send">发送 ${icon('arrow')}</button></div></div></aside>`;
    }
    function detail(db, ui) {
      const request = db.requests.find((r) => r.id === ui.requestId),
        node = Aide.get(request, ui.nodeId);

    }
    return { nodeLabel, detail };
  })(),
);
